<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>視られる場所 — 廃病院の記録</title>
<style>
  :root{
    --bg: #0f0d0c;
    --panel: #171310;
    --panel-edge: #2a2119;
    --ink: #cfc6b8;
    --ink-dim: #857c6f;
    --blood: #7a1620;
    --blood-bright: #a4222f;
    --rust: #8a6a4a;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0;
    min-height:100%;
    background:
      radial-gradient(ellipse at 50% -10%, #1c1613 0%, var(--bg) 55%);
    color:var(--ink);
    font-family: Georgia, "Iowan Old Style", "Hiragino Mincho ProN", serif;
    line-height:1.9;
  }
  .scanlines{
    position:fixed; inset:0; pointer-events:none; z-index:5;
    background:repeating-linear-gradient(
      to bottom, rgba(0,0,0,0.12) 0px, rgba(0,0,0,0.12) 1px,
      transparent 2px, transparent 3px
    );
    opacity:.35;
    mix-blend-mode:multiply;
  }
  .stage{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:32px 18px;
  }
  .file{
    width:100%;
    max-width:620px;
    background:var(--panel);
    border:1px solid var(--panel-edge);
    box-shadow: 0 0 0 1px rgba(0,0,0,.4), 0 30px 60px rgba(0,0,0,.6);
    position:relative;
  }
  .file::before{
    content:"";
    position:absolute; inset:10px;
    border:1px solid rgba(138,106,74,.25);
    pointer-events:none;
  }
  .file-head{
    font-family:"Courier New", monospace;
    font-size:11px;
    letter-spacing:.06em;
    color:var(--ink-dim);
    padding:20px 34px 0 34px;
    display:flex;
    justify-content:space-between;
    flex-wrap:wrap;
    gap:4px 14px;
  }
  .file-body{
    padding:22px 34px 34px 34px;
  }
  .scene-image-wrap{
    position:relative;
    width:100%;
    aspect-ratio: 13 / 9;
    overflow:hidden;
    margin-bottom:20px;
    background:#000;
  }
  .scene-image{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
    animation: img-in 1.1s ease-out;
  }
  @keyframes img-in{
    0%{opacity:0; transform:scale(1.03);}
    100%{opacity:1; transform:scale(1);}
  }
  .tone-overlay{ position:absolute; inset:0; pointer-events:none; }
  .fade-bottom{
    position:absolute; left:0; right:0; bottom:0; height:38%;
    background:linear-gradient(to bottom, rgba(23,19,16,0), var(--panel) 92%);
    pointer-events:none;
  }
  .ending-good .tone-overlay{ background:rgba(196,150,90,.20); mix-blend-mode:overlay; }
  .ending-bad .tone-overlay{ background:rgba(122,22,32,.36); mix-blend-mode:multiply; }
  .ending-neutral .tone-overlay{ background:rgba(15,13,12,.20); mix-blend-mode:multiply; }
  .title-image-wrap{
    position:relative;
    width:100%;
    aspect-ratio: 13 / 9;
    overflow:hidden;
    margin-bottom:20px;
  }
  .title-image-wrap img{
    width:100%; height:100%; object-fit:cover; display:block;
  }
  .title-image-wrap .fade-bottom{ height:55%; }
  .scene-text{
    font-size:17px;
    color:var(--ink);
    white-space:pre-wrap;
    animation: flicker-in .9s ease-out;
    min-height:1em;
  }
  .voice-line{
    display:block;
    margin-top:14px;
    font-size:14.5px;
    font-style:italic;
    color:var(--ink-dim);
  }
  @keyframes flicker-in{
    0%{opacity:0;}
    8%{opacity:1;}
    11%{opacity:.15;}
    16%{opacity:1;}
    100%{opacity:1;}
  }
  .choices{
    margin-top:28px;
    display:flex;
    flex-direction:column;
    gap:10px;
  }
  button.choice{
    all:unset;
    cursor:pointer;
    display:block;
    font-family: Georgia, serif;
    font-size:15px;
    color:var(--ink);
    background:transparent;
    border:1px solid var(--panel-edge);
    padding:13px 16px;
    line-height:1.6;
    transition: border-color .15s ease, background .15s ease, padding-left .15s ease;
  }
  button.choice:hover, button.choice:focus-visible{
    border-color:var(--blood);
    background:rgba(122,22,32,.10);
    padding-left:22px;
  }
  button.choice:focus-visible{outline: 1px dashed var(--rust); outline-offset:3px;}
  button.choice::before{
    content:"— ";
    color:var(--blood-bright);
  }
  .start-wrap{ text-align:center; }
  .title{
    font-size:26px;
    letter-spacing:.02em;
    margin:0 0 6px 0;
    color:var(--ink);
  }
  .subtitle{
    font-family:"Courier New", monospace;
    font-size:12px;
    color:var(--ink-dim);
    margin:0 0 26px 0;
  }
  .intro-text{
    font-size:15px;
    color:var(--ink-dim);
    margin-bottom:26px;
    text-align:left;
  }
  .game-badge{
    display:inline-block;
    font-family:"Courier New", monospace;
    font-size:11px;
    letter-spacing:.08em;
    color:var(--blood-bright);
    border:1px solid var(--blood);
    padding:4px 10px;
    margin-bottom:18px;
  }
  button.primary{
    all:unset;
    cursor:pointer;
    font-family:"Courier New", monospace;
    font-size:13px;
    letter-spacing:.08em;
    color:var(--ink);
    border:1px solid var(--blood);
    padding:12px 26px;
    transition: background .15s ease;
  }
  button.primary:hover{ background:rgba(122,22,32,.18); }
  button.primary:disabled{ opacity:.35; cursor:not-allowed; }
  .ending-tag{
    font-family:"Courier New", monospace;
    font-size:11px;
    color:var(--rust);
    margin-bottom:4px;
  }
  .ending-title{
    font-size:22px;
    margin:0 0 16px 0;
    color:var(--ink);
  }
  .footer-note{
    margin-top:30px;
    font-family:"Courier New", monospace;
    font-size:10.5px;
    color:var(--ink-dim);
    border-top:1px solid var(--panel-edge);
    padding-top:14px;
  }
  .mute-btn{
    all:unset;
    cursor:pointer;
    font-family:"Courier New", monospace;
    font-size:11px;
    letter-spacing:.04em;
    color:var(--ink-dim);
    border:1px solid var(--panel-edge);
    padding:3px 9px;
  }
  .mute-btn:hover{ border-color:var(--rust); color:var(--ink); }
  .mute-btn.is-muted{ color:var(--blood-bright); border-color:var(--blood); }

  /* --- キャラメイク --- */
  .form-block{ margin-bottom:22px; text-align:left; }
  .form-label{
    display:block;
    font-family:"Courier New", monospace;
    font-size:11px;
    letter-spacing:.08em;
    color:var(--rust);
    margin-bottom:8px;
  }
  input.name-input{
    all:unset;
    display:block;
    width:100%;
    font-family: Georgia, serif;
    font-size:16px;
    color:var(--ink);
    background:rgba(0,0,0,.25);
    border:1px solid var(--panel-edge);
    padding:11px 14px;
  }
  input.name-input:focus{ border-color:var(--blood); }
  .option-row{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
  }
  .option-btn{
    all:unset;
    cursor:pointer;
    font-family: Georgia, serif;
    font-size:14.5px;
    color:var(--ink-dim);
    border:1px solid var(--panel-edge);
    padding:10px 18px;
    transition: border-color .15s ease, color .15s ease, background .15s ease;
  }
  .option-btn.selected{
    border-color:var(--blood);
    color:var(--ink);
    background:rgba(122,22,32,.14);
  }
</style>
</head>
<body>
<div class="scanlines"></div>
<div class="stage">
  <div class="file">
    <div class="file-head">
      <span id="fileTag">CASE FILE — 未収録</span>
      <span id="profileTag"></span>

    </div>

<script>
/* ---------- 音声パス ---------- */
const audioPaths = {
  theme:      "assets/audio/十五の夜明け.mp3",
  bgmExplore: "assets/audio/沈む廊下.mp3",
  bgmChase:   "assets/audio/錆びた足音.mp3",
  bgmGood:    "assets/audio/薄明の窓.mp3",
  bgmBad:     "assets/audio/煤の回廊.mp3",
  seClick:       "assets/SE/キーボード1.mp3",
  seTransition:  "assets/SE/シーン切り替え2.mp3",
  ambFootsteps:  "assets/SE/アスファルトの上を歩く1.mp3",
  ambHeartbeat:  "assets/SE/心臓の鼓動1.mp3"
};

/* シーンごとの音声設定: bgm(ループ曲) / amb(重ねるループ効果音、無ければnull) */
const sceneAudio = {
  title:  { bgm:"theme",      amb:null },
  charGen:{ bgm:"theme",      amb:null },
  s1:     { bgm:"bgmExplore", amb:null },
  s2:     { bgm:"bgmExplore", amb:null },
  s3:     { bgm:"bgmExplore", amb:null },
  s4:     { bgm:"bgmChase",   amb:"ambFootsteps" },
  s5:     { bgm:"bgmChase",   amb:"ambFootsteps" },
  s6:     { bgm:"bgmExplore", amb:"ambHeartbeat" },
  s7:     { bgm:"bgmChase",   amb:"ambHeartbeat" }
};

/* ---------- 音声マネージャー ---------- */
const BGM_VOL = 0.5, AMB_VOL = 0.32, SE_VOL = 0.55;
let muted = false;
let currentBgmKey = null, currentAmbKey = null;
const bgmEl = new Audio(); bgmEl.loop = true; bgmEl.volume = 0;
const ambEl = new Audio(); ambEl.loop = true; ambEl.volume = 0;
const fadeTimers = new WeakMap();

function fadeVolume(el, target, ms){
  if(fadeTimers.has(el)) clearInterval(fadeTimers.get(el));
  const steps = 20;
  const start = el.volume;
  const stepMs = ms / steps;
  let i = 0;
  const timer = setInterval(()=>{
    i++;
    el.volume = Math.max(0, Math.min(1, start + (target - start) * (i/steps)));
    if(i >= steps){
      clearInterval(timer);
      fadeTimers.delete(el);
      if(target === 0) el.pause();
    }
  }, stepMs);
  fadeTimers.set(el, timer);
}

function setTrack(el, key, baseVol){
  const path = key ? audioPaths[key] : null;
  const wantVol = muted ? 0 : baseVol;
  if(!path){
    fadeVolume(el, 0, 500);
    return;
  }
  const currentSrc = el.dataset.key;
  if(currentSrc === key){
    if(!muted && el.paused) el.play().catch(()=>{});
    fadeVolume(el, wantVol, 400);
    return;
  }
  fadeVolume(el, 0, 350);
  setTimeout(()=>{
    el.src = path;
    el.dataset.key = key;
    el.currentTime = 0;
    if(!muted){
      el.play().catch(()=>{});
      fadeVolume(el, wantVol, 600);
    }
  }, 360);
}

function applySceneAudio(sceneKey){
  const cfg = sceneAudio[sceneKey];
  if(!cfg) return;
  currentBgmKey = cfg.bgm;
  currentAmbKey = cfg.amb;
  setTrack(bgmEl, cfg.bgm, BGM_VOL);
  setTrack(ambEl, cfg.amb, AMB_VOL);
}

function applyEndingAudio(tone){
  const key = tone === "good" ? "bgmGood" : "bgmBad";
  currentBgmKey = key;
  currentAmbKey = null;
  setTrack(bgmEl, key, BGM_VOL);
  setTrack(ambEl, null, 0);
}

function playSE(key){
  if(muted) return;
  const a = new Audio(audioPaths[key]);
  a.volume = SE_VOL;
  a.play().catch(()=>{});
}

function toggleMute(){
  muted = !muted;
  const btn = document.getElementById("muteBtn");
  if(muted){
    btn.textContent = "♪ OFF";
    btn.classList.add("is-muted");
    fadeVolume(bgmEl, 0, 300);
    fadeVolume(ambEl, 0, 300);
  }else{
    btn.textContent = "♪ ON";
    btn.classList.remove("is-muted");
    if(bgmEl.dataset.key){ bgmEl.play().catch(()=>{}); fadeVolume(bgmEl, BGM_VOL, 400); }
    if(ambEl.dataset.key){ ambEl.play().catch(()=>{}); fadeVolume(ambEl, AMB_VOL, 400); }
  }
}

/* ---------- ストーリーデータ ---------- */
const scenes = {

    choices:[

/* ---------- エンディング判定 ---------- */
function decideEnding(s){
  const {jihi,seigi,dasan,kyofu} = s;
  const stats = [["jihi",jihi],["seigi",seigi],["dasan",dasan],["kyofu",kyofu]];
  stats.sort((a,b)=>b[1]-a[1]);
  const [topKey, topVal] = stats[0];
  const [secondKey, secondVal] = stats[1];

  if(s.dealChoice === "accept"){
    return s.flags.cursedItem ? 12 : 9;
  }
  if(s.dealChoice === "reject" && topKey === "seigi" && kyofu <= 2){
    return 14;
  }
  if(s.flags.savedCompanion && topKey === "jihi"){
    return 13;
  }
  if(s.flags.cursedItem){
    return 15;
  }
  if(topVal - secondVal <= 1){
    return 11;
  }
  switch(topKey){
    case "jihi":
      if(secondKey === "seigi") return 1;
      if(secondKey === "dasan") return 3;
      return 2;
    case "seigi":
      if(secondKey === "dasan") return 5;
      if(secondKey === "kyofu") return 6;
      return 4;
    case "dasan":
      if(secondKey === "kyofu") return 8;
      return 7;
    case "kyofu":
      if(secondKey === "jihi") return 10;
      return 9;
  }
  return 11;
}

/* ---------- テンプレート置換 ---------- */
function applyTemplate(str){
  const nm = player.name || "あなた";
  const pn = pronounOf(player.gender || "male");
  return str.replace(/\{name\}/g, nm).replace(/\{pronoun\}/g, pn);
}

/* ---------- レンダリング ---------- */
const root = document.getElementById("root");
const fileTag = document.getElementById("fileTag");
const profileTag = document.getElementById("profileTag");
const sceneTag = document.getElementById("sceneTag");

function renderTitle(){
  fileTag.textContent = "CASE FILE — 未収録";
  profileTag.textContent = "";
  sceneTag.textContent = "START";
  applySceneAudio("title");
  root.innerHTML = `
    <div class="title-image-wrap">
      <img src="${sceneImages.title}" alt="">
      <div class="fade-bottom"></div>
    </div>
    <div class="start-wrap">
      <span class="game-badge">CHOICE-DRIVEN SURVIVAL HORROR</span>
      <p class="title">視られる場所</p>
      <p class="subtitle">— 廃病院の記録 —</p>
      <p class="intro-text">これは、読み進める物語ではなく、選び続けるゲームです。<br>
      すべての選択があなたの内面を記録し、最後にひとつの結末を選び出します。<br>
      同じ場所でも、選ぶ人が違えば、たどり着く記録は変わります。</p>
      <button class="primary" id="toCharBtn">対象者を設定する</button>
    </div>
  `;
  document.getElementById("toCharBtn").addEventListener("click", ()=>{
    playSE("seClick");
    renderCharCreate();
  });
}

function renderCharCreate(){
  fileTag.textContent = "CASE FILE — 対象者設定";
  profileTag.textContent = "";
  sceneTag.textContent = "SETUP";
  applySceneAudio("charGen");

  const draft = { name:"", gender:null, age:null };

  root.innerHTML = `
    <div class="form-block">
      <span class="form-label">対象者名</span>
      <input type="text" class="name-input" id="nameInput" placeholder="名前を入力" maxlength="12">
    </div>
    <div class="form-block">
      <span class="form-label">性別</span>
      <div class="option-row" id="genderRow">
        <button class="option-btn" data-val="male">男性</button>
        <button class="option-btn" data-val="female">女性</button>
      </div>
    </div>
    <div class="form-block">
      <span class="form-label">年齢層</span>
      <div class="option-row" id="ageRow">
        <button class="option-btn" data-val="youth">若者</button>
        <button class="option-btn" data-val="adult">壮年</button>
      </div>
    </div>
    <div class="choices">
      <button class="primary" id="startGameBtn" disabled>この人物で記録を開始する</button>
    </div>
  `;

  const nameInput = document.getElementById("nameInput");
  const genderRow = document.getElementById("genderRow");
  const ageRow = document.getElementById("ageRow");
  const startBtn = document.getElementById("startGameBtn");

  function checkReady(){
    startBtn.disabled = !(draft.name.trim().length > 0 && draft.gender && draft.age);
  }

  nameInput.addEventListener("input", e=>{
    draft.name = e.target.value;
    checkReady();
  });

  genderRow.querySelectorAll(".option-btn").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      playSE("seClick");
      genderRow.querySelectorAll(".option-btn").forEach(b=>b.classList.remove("selected"));
      btn.classList.add("selected");
      draft.gender = btn.dataset.val;
      checkReady();
    });
  });

  ageRow.querySelectorAll(".option-btn").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      playSE("seClick");
      ageRow.querySelectorAll(".option-btn").forEach(b=>b.classList.remove("selected"));
      btn.classList.add("selected");
      draft.age = btn.dataset.val;
      checkReady();
    });
  });

  startBtn.addEventListener("click", ()=>{
    if(startBtn.disabled) return;
    playSE("seClick");
    player = { name: draft.name.trim(), gender: draft.gender, age: draft.age };
    state = freshState();
    renderScene("s1");
  });
}

function updateProfileTag(){
  profileTag.textContent = `対象者：${player.name}(${genderLabel[player.gender]}／${ageLabel[player.age]})`;
}

function renderScene(id){
  const scene = scenes[id];
  fileTag.textContent = "CASE FILE — 継続中";
  updateProfileTag();
  sceneTag.textContent = scene.tag;
  applySceneAudio(id);
  playSE("seTransition");

  const bodyText = applyTemplate(scene.text);
  const voice = voiceLines[id] ? applyTemplate(voiceLines[id][player.age]) : "";

  root.innerHTML = `
    <div class="scene-image-wrap">
      <img class="scene-image" src="${sceneImages[id]}" alt="">
      <div class="fade-bottom"></div>
    </div>
    <div class="scene-text">${escapeHTML(bodyText)}${voice ? `<span class="voice-line">${escapeHTML(voice)}</span>` : ""}</div>
    <div class="choices"></div>
  `;
  const choicesEl = root.querySelector(".choices");
  scene.choices.forEach(c=>{
    const btn = document.createElement("button");
    btn.className = "choice";
    btn.textContent = applyTemplate(c.label);
    btn.addEventListener("click", ()=>{
      playSE("seClick");
      if(c.stat) state[c.stat] += c.n;
      if(c.flag) state.flags[c.flag] = true;
      if(c.deal) state.dealChoice = c.deal;
      if(c.next === "END"){
        renderEnding();
      }else{
        renderScene(c.next);
      }
    });
    choicesEl.appendChild(btn);
  });
}

function renderEnding(){
  const id = decideEnding(state);
  const e = endings[id];
  fileTag.textContent = "CASE FILE — 終結";
  updateProfileTag();
  sceneTag.textContent = "END " + String(id).padStart(2,"0") + " / 15";
  applyEndingAudio(e.tone);
  playSE("seTransition");
  root.innerHTML = `
    <div class="scene-image-wrap ending-${e.tone}">
      <img class="scene-image" src="${sceneImages[e.img]}" alt="">
      <div class="tone-overlay"></div>
      <div class="fade-bottom"></div>
    </div>
    <div class="scene-text">
      <div class="ending-tag">ENDING ${String(id).padStart(2,"0")} / 15</div>
      <p class="ending-title">${escapeHTML(e.title)}</p>
      ${escapeHTML(applyTemplate(e.body))}
    </div>
    <div class="choices">
      <button class="choice" id="retryBtn">別人物で、もう一度記録を開く</button>
    </div>
    <div class="footer-note">この病院には、まだ語られていない結末が残っている。</div>
  `;
  document.getElementById("retryBtn").addEventListener("click", ()=>{
    playSE("seClick");
    renderTitle();
  });
}

function escapeHTML(str){
  return str
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/\n/g,"<br>");
}

document.getElementById("muteBtn").addEventListener("click", toggleMute);
renderTitle();
</script>
