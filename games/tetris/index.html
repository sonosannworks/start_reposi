<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>テトリス</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: #12141c;
    color: #eee;
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", sans-serif;
    overflow: hidden;
    touch-action: none;
  }
  #app {
    display: flex;
    flex-direction: column;
    align-items: center;
    height: 100%;
    padding: 8px;
  }
  #topbar {
    display: flex;
    justify-content: space-between;
    width: 100%;
    max-width: 400px;
    padding: 4px 6px;
  }
  .stat {
    background: #1c1f2b;
    border-radius: 8px;
    padding: 6px 12px;
    text-align: center;
    min-width: 70px;
  }
  .stat .label { font-size: 11px; color: #888; }
  .stat .value { font-size: 18px; font-weight: bold; color: #fff; }
  #playfield-wrap {
    position: relative;
    display: flex;
    justify-content: center;
    margin-top: 6px;
    flex: 1;
    min-height: 0;
  }
  canvas#board {
    background: #0a0b10;
    border: 2px solid #333a4d;
    border-radius: 6px;
    display: block;
    height: 100%;
    max-width: 60vw;
  }
  #side {
    display: flex;
    flex-direction: column;
    gap: 8px;
    margin-left: 10px;
    width: 80px;
  }
  #next-box, #hold-box {
    background: #1c1f2b;
    border-radius: 8px;
    padding: 6px;
    text-align: center;
  }
  #next-box .label, #hold-box .label { font-size: 11px; color: #888; margin-bottom: 4px; }
  canvas#nextCanvas, canvas#holdCanvas { width: 100%; height: 60px; }
  #overlay {
    position: absolute;
    inset: 0;
    background: rgba(10,11,16,0.88);
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    border-radius: 6px;
    text-align: center;
    padding: 20px;
  }
  #overlay h2 { margin: 0 0 8px; font-size: 22px; }
  #overlay p { margin: 4px 0; color: #aaa; font-size: 14px; }
  #overlay button {
    margin-top: 14px;
    background: #4a7dff;
    color: #fff;
    border: none;
    border-radius: 8px;
    padding: 10px 22px;
    font-size: 15px;
    font-weight: bold;
  }
  #controls {
    width: 100%;
    max-width: 400px;
    margin-top: 10px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    padding-bottom: env(safe-area-inset-bottom, 8px);
  }
  #controls .row { display: flex; justify-content: center; gap: 10px; }
  .ctrlbtn {
    background: #232738;
    border: 1px solid #3a4058;
    color: #eee;
    border-radius: 10px;
    width: 58px;
    height: 50px;
    font-size: 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    active-scale: 0.95;
  }
  .ctrlbtn:active { background: #353950; }
  .ctrlbtn.wide { width: 120px; }
  #pauseBtn {
    position: absolute;
    top: 4px;
    right: 4px;
    background: #232738;
    border: 1px solid #3a4058;
    color: #eee;
    border-radius: 6px;
    padding: 6px 10px;
    font-size: 13px;
  }
  #muteBtn {
    position: absolute;
    top: 4px;
    right: 88px;
    z-index: 5;
    background: #232738;
    border: 1px solid #3a4058;
    color: #eee;
    border-radius: 6px;
    padding: 6px 9px;
    font-size: 15px;
    line-height: 1;
  }
</style>
</head>
<body>
<div id="app">
  <audio id="bgm" src="assets/bgm/kodama-no-mori2.mp3" loop preload="none"></audio>
  <div id="topbar">
    <div class="stat"><div class="label">スコア</div><div class="value" id="scoreVal">0</div></div>
    <div class="stat"><div class="label">レベル</div><div class="value" id="levelVal">1</div></div>
    <div class="stat"><div class="label">ライン</div><div class="value" id="linesVal">0</div></div>
  </div>

  <div id="playfield-wrap">
    <canvas id="board"></canvas>
    <div id="side">
      <div id="hold-box">
        <div class="label">ホールド</div>
        <canvas id="holdCanvas" width="80" height="60"></canvas>
      </div>
      <div id="next-box">
        <div class="label">ネクスト</div>
        <canvas id="nextCanvas" width="80" height="60"></canvas>
      </div>
    </div>
    <button id="pauseBtn">一時停止</button>
    <button id="muteBtn" type="button" aria-label="BGMのオン・オフ">🔊</button>
    <div id="overlay">
      <h2 id="overlayTitle">テトリス</h2>
      <p id="overlaySub">タップしてスタート</p>
      <button id="overlayBtn">スタート</button>
    </div>
  </div>

  <div id="controls">
    <div class="row">
      <div class="ctrlbtn" id="btnHold">Hold</div>
      <div class="ctrlbtn" id="btnRotate">⟳</div>
      <div class="ctrlbtn" id="btnHardDrop">⇓</div>
    </div>
    <div class="row">
      <div class="ctrlbtn" id="btnLeft">◀</div>
      <div class="ctrlbtn" id="btnDown">▼</div>
      <div class="ctrlbtn" id="btnRight">▶</div>
    </div>
  </div>
</div>

<script>
(function(){
  const COLS = 10, ROWS = 20;
  const boardCanvas = document.getElementById('board');
  const ctx = boardCanvas.getContext('2d');
  const nextCanvas = document.getElementById('nextCanvas');
  const nctx = nextCanvas.getContext('2d');
  const holdCanvas = document.getElementById('holdCanvas');
  const hctx = holdCanvas.getContext('2d');

  const COLORS = {
    I: '#4ad7f0', J: '#4a6fff', L: '#ffa64a',
    O: '#ffe14a', S: '#5cf07a', T: '#c96af0', Z: '#ff5c5c'
  };

  const SHAPES = {
    I: [[0,1],[1,1],[2,1],[3,1]],
    J: [[0,0],[0,1],[1,1],[2,1]],
    L: [[2,0],[0,1],[1,1],[2,1]],
    O: [[1,0],[2,0],[1,1],[2,1]],
    S: [[1,0],[2,0],[0,1],[1,1]],
    T: [[1,0],[0,1],[1,1],[2,1]],
    Z: [[0,0],[1,0],[1,1],[2,1]]
  };

  function cellSize(){
    return boardCanvas.height / ROWS;
  }

  function resizeCanvas(){
    const wrap = document.getElementById('playfield-wrap');
    const availH = wrap.clientHeight - 8;
    const availW = wrap.clientWidth * 0.62;
    let h = availH;
    let cs = h / ROWS;
    let w = cs * COLS;
    if (w > availW) {
      w = availW;
      cs = w / COLS;
      h = cs * ROWS;
    }
    boardCanvas.width = Math.floor(w);
    boardCanvas.height = Math.floor(h);
    draw();
  }

  let grid, current, next, hold, canHold, bag, score, level, lines, gameOver, paused, dropInterval, dropTimer, running;

  function newBag(){
    const keys = Object.keys(SHAPES);
    for (let i = keys.length -1; i>0; i--){
      const j = Math.floor(Math.random()*(i+1));
      [keys[i],keys[j]] = [keys[j],keys[i]];
    }
    return keys;
  }

  function makePiece(type){
    return { type, cells: SHAPES[type].map(c=>c.slice()), x: 3, y: -1, rot:0 };
  }

  function nextFromBag(){
    if (!bag || bag.length===0) bag = newBag();
    const type = bag.pop();
    return makePiece(type);
  }

  function resetGame(){
    grid = Array.from({length: ROWS}, ()=>Array(COLS).fill(null));
    bag = newBag();
    current = nextFromBag();
    next = nextFromBag();
    hold = null;
    canHold = true;
    score = 0; level = 1; lines = 0;
    gameOver = false; paused = false;
    dropInterval = 800;
    updateStats();
    spawnCheck();
  }

  function updateStats(){
    document.getElementById('scoreVal').textContent = score;
    document.getElementById('levelVal').textContent = level;
    document.getElementById('linesVal').textContent = lines;
  }

  function collides(piece, offX, offY, rotCells){
    const cells = rotCells || piece.cells;
    for (const [cx, cy] of cells){
      const x = piece.x + cx + offX;
      const y = piece.y + cy + offY;
      if (x < 0 || x >= COLS || y >= ROWS) return true;
      if (y >= 0 && grid[y][x]) return true;
    }
    return false;
  }

  function rotateCells(piece){
    if (piece.type === 'O') return piece.cells.map(c=>c.slice());
    const cx = piece.cells.reduce((s,c)=>s+c[0],0)/4;
    const cy = piece.cells.reduce((s,c)=>s+c[1],0)/4;
    return piece.cells.map(([x,y])=>{
      const rx = x - cx, ry = y - cy;
      const nx = -ry + cx, ny = rx + cy;
      return [Math.round(nx), Math.round(ny)];
    });
  }

  function tryRotate(){
    if (gameOver || paused) return;
    const rotated = rotateCells(current);
    const kicks = [0,-1,1,-2,2];
    for (const k of kicks){
      if (!collides(current, k, 0, rotated)){
        current.cells = rotated;
        current.x += k;
        draw();
        return;
      }
    }
  }

  function lockPiece(){
    for (const [cx,cy] of current.cells){
      const x = current.x+cx, y = current.y+cy;
      if (y>=0) grid[y][x] = current.type;
    }
    clearLines();
    canHold = true;
    current = next;
    next = nextFromBag();
    drawNext();
    spawnCheck();
  }

  function spawnCheck(){
    current.x = 3; current.y = -1;
    if (collides(current, 0, 0)){
      gameOver = true;
      showOverlay('ゲームオーバー', 'スコア: ' + score, 'もう一度');
      stopLoop();
      fadeOutBgm();
    }
    draw();
  }

  function clearLines(){
    let cleared = 0;
    for (let y = ROWS-1; y>=0; y--){
      if (grid[y].every(c=>c)){
        grid.splice(y,1);
        grid.unshift(Array(COLS).fill(null));
        cleared++;
        y++;
      }
    }
    if (cleared > 0){
      const points = [0,100,300,500,800][cleared] * level;
      score += points;
      lines += cleared;
      const newLevel = Math.floor(lines/10)+1;
      if (newLevel !== level){
        level = newLevel;
        dropInterval = Math.max(120, 800 - (level-1)*70);
      }
      updateStats();
    }
  }

  function moveDown(){
    if (gameOver || paused) return;
    if (!collides(current, 0, 1)){
      current.y++;
    } else {
      lockPiece();
    }
    draw();
  }

  function hardDrop(){
    if (gameOver || paused) return;
    let dist = 0;
    while (!collides(current, 0, dist+1)) dist++;
    current.y += dist;
    score += dist*2;
    lockPiece();
    updateStats();
  }

  function moveHoriz(dir){
    if (gameOver || paused) return;
    if (!collides(current, dir, 0)){
      current.x += dir;
      draw();
    }
  }

  function doHold(){
    if (gameOver || paused || !canHold) return;
    canHold = false;
    if (hold === null){
      hold = makePiece(current.type);
      current = next;
      next = nextFromBag();
      drawNext();
    } else {
      const tmp = hold.type;
      hold = makePiece(current.type);
      current = makePiece(tmp);
    }
    current.x = 3; current.y = -1;
    drawHold();
    draw();
  }

  function ghostY(){
    let dist = 0;
    while (!collides(current, 0, dist+1)) dist++;
    return current.y + dist;
  }

  function drawCell(c, px, py, size, color, alpha){
    c.globalAlpha = alpha===undefined?1:alpha;
    c.fillStyle = color;
    c.fillRect(px+1, py+1, size-2, size-2);
    c.globalAlpha = 1;
  }

  function draw(){
    const cs = cellSize();
    ctx.clearRect(0,0,boardCanvas.width, boardCanvas.height);
    for (let y=0;y<ROWS;y++){
      for (let x=0;x<COLS;x++){
        ctx.strokeStyle = 'rgba(255,255,255,0.04)';
        ctx.strokeRect(x*cs, y*cs, cs, cs);
        if (grid[y][x]){
          drawCell(ctx, x*cs, y*cs, cs, COLORS[grid[y][x]]);
        }
      }
    }
    if (!gameOver){
      const gy = ghostY();
      for (const [cx,cy] of current.cells){
        const y = gy+cy;
        if (y>=0) drawCell(ctx, (current.x+cx)*cs, y*cs, cs, COLORS[current.type], 0.25);
      }
      for (const [cx,cy] of current.cells){
        const y = current.y+cy;
        if (y>=0) drawCell(ctx, (current.x+cx)*cs, y*cs, cs, COLORS[current.type]);
      }
    }
  }

  function drawMini(c, canvas, piece){
    c.clearRect(0,0,canvas.width, canvas.height);
    if (!piece) return;
    const size = 14;
    const minX = Math.min(...piece.cells.map(p=>p[0]));
    const maxX = Math.max(...piece.cells.map(p=>p[0]));
    const minY = Math.min(...piece.cells.map(p=>p[1]));
    const maxY = Math.max(...piece.cells.map(p=>p[1]));
    const w = (maxX-minX+1)*size, h = (maxY-minY+1)*size;
    const offX = (canvas.width - w)/2, offY = (canvas.height - h)/2;
    for (const [cx,cy] of piece.cells){
      drawCell(c, offX+(cx-minX)*size, offY+(cy-minY)*size, size, COLORS[piece.type]);
    }
  }

  function drawNext(){ drawMini(nctx, nextCanvas, next); }
  function drawHold(){ drawMini(hctx, holdCanvas, hold); }

  function stopLoop(){
    running = false;
    if (dropTimer) clearTimeout(dropTimer);
  }

  function loop(){
    if (!running) return;
    if (!paused && !gameOver){
      moveDown();
    }
    dropTimer = setTimeout(loop, dropInterval);
  }

  function startLoop(){
    running = true;
    if (dropTimer) clearTimeout(dropTimer);
    loop();
  }

  // ===== BGM =====
  const BGM_VOL = 0.35;
  const bgm = document.getElementById('bgm');
  const muteBtn = document.getElementById('muteBtn');
  let bgmMuted = false;
  let bgmFadeTimer = null;

  bgm.volume = BGM_VOL;

  function playBgm(fromStart){
    if (bgmFadeTimer){ clearInterval(bgmFadeTimer); bgmFadeTimer = null; }
    try {
      bgm.muted = bgmMuted;
      bgm.volume = BGM_VOL;
      if (fromStart) bgm.currentTime = 0;
      const p = bgm.play();
      if (p && p.catch) p.catch(()=>{});
    } catch(e){}
  }
  function pauseBgm(){
    if (bgmFadeTimer){ clearInterval(bgmFadeTimer); bgmFadeTimer = null; }
    try { bgm.pause(); } catch(e){}
  }
  function fadeOutBgm(){
    if (bgmFadeTimer) clearInterval(bgmFadeTimer);
    bgmFadeTimer = setInterval(()=>{
      const v = bgm.volume - BGM_VOL / 16;
      if (v <= 0.02){
        clearInterval(bgmFadeTimer); bgmFadeTimer = null;
        try { bgm.pause(); bgm.currentTime = 0; } catch(e){}
        bgm.volume = BGM_VOL;
      } else {
        bgm.volume = v;
      }
    }, 45);
  }

  muteBtn.addEventListener('click', ()=>{
    bgmMuted = !bgmMuted;
    bgm.muted = bgmMuted;
    muteBtn.textContent = bgmMuted ? '🔇' : '🔊';
  });

  const overlay = document.getElementById('overlay');
  const overlayTitle = document.getElementById('overlayTitle');
  const overlaySub = document.getElementById('overlaySub');
  const overlayBtn = document.getElementById('overlayBtn');

  function showOverlay(title, sub, btnText){
    overlayTitle.textContent = title;
    overlaySub.textContent = sub;
    overlayBtn.textContent = btnText;
    overlay.style.display = 'flex';
  }
  function hideOverlay(){ overlay.style.display = 'none'; }

  overlayBtn.addEventListener('click', ()=>{
    hideOverlay();
    resetGame();
    drawNext(); drawHold();
    startLoop();
    playBgm(true);
  });

  document.getElementById('pauseBtn').addEventListener('click', ()=>{
    if (gameOver) return;
    paused = !paused;
    if (paused){
      showOverlay('一時停止中', '', '再開');
      pauseBgm();
    } else {
      hideOverlay();
      playBgm(false);
    }
  });

  function bindBtn(id, fn){
    const el = document.getElementById(id);
    el.addEventListener('touchstart', (e)=>{ e.preventDefault(); fn(); }, {passive:false});
    el.addEventListener('click', fn);
  }
  bindBtn('btnLeft', ()=>moveHoriz(-1));
  bindBtn('btnRight', ()=>moveHoriz(1));
  bindBtn('btnDown', moveDown);
  bindBtn('btnRotate', tryRotate);
  bindBtn('btnHardDrop', hardDrop);
  bindBtn('btnHold', doHold);

  document.addEventListener('keydown', (e)=>{
    if (['ArrowLeft','ArrowRight','ArrowDown','ArrowUp',' '].includes(e.key)) e.preventDefault();
    if (gameOver || paused) return;
    if (e.key === 'ArrowLeft') moveHoriz(-1);
    else if (e.key === 'ArrowRight') moveHoriz(1);
    else if (e.key === 'ArrowDown') moveDown();
    else if (e.key === 'ArrowUp') tryRotate();
    else if (e.key === ' ') hardDrop();
    else if (e.key === 'c' || e.key === 'C') doHold();
  });

  let touchStartX=null, touchStartY=null, touchStartT=0, moved=false;
  boardCanvas.addEventListener('touchstart', (e)=>{
    const t = e.touches[0];
    touchStartX = t.clientX; touchStartY = t.clientY; touchStartT = Date.now(); moved=false;
  }, {passive:true});
  boardCanvas.addEventListener('touchmove', (e)=>{
    if (touchStartX===null) return;
    const t = e.touches[0];
    const dx = t.clientX - touchStartX;
    const dy = t.clientY - touchStartY;
    const cs = cellSize();
    if (Math.abs(dx) > cs*0.8){
      moveHoriz(dx>0?1:-1);
      touchStartX = t.clientX;
      moved = true;
    }
    if (dy > cs*1.2){
      moveDown();
      touchStartY = t.clientY;
      moved = true;
    }
  }, {passive:true});
  boardCanvas.addEventListener('touchend', (e)=>{
    const dt = Date.now() - touchStartT;
    if (!moved && dt < 250){
      tryRotate();
    } else if (!moved && dt >= 250){
      // long press without move = nothing extra
    }
    touchStartX = null;
  });

  window.addEventListener('resize', resizeCanvas);
  setTimeout(resizeCanvas, 50);

  resetGame();
  drawNext(); drawHold();
  draw();
  showOverlay('テトリス', 'スワイプで移動・タップで回転\n下ボタンでソフトドロップ', 'スタート');
})();
</script>
</body>
</html>
