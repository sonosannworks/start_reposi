<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>勇者の旅 〜三人のパーティー〜</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-deep:#12101E;
    --bg-deep-2:#1B1832;
    --window:#1D1B33;
    --gold:#E8C468;
    --gold-deep:#B8934A;
    --text:#F1EFEA;
    --text-soft:#B4AFCB;
    --hp:#6FCF97;
    --hp-low:#E8607A;
    --mp:#5AA9E6;
    --enemy:#E86464;
    --hero:#E8C468;
    --aria:#B79CED;
    --roi:#7FB0E0;
    --radius:14px;
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; height:100%; }
  body{
    min-height:100vh;
    background:var(--bg-deep);
    color:var(--text);
    font-family:"Zen Kaku Gothic New", "Hiragino Sans", sans-serif;
    overflow-x:hidden;
  }
  .screen{ display:none; min-height:100vh; }
  .screen.show{ display:flex; }

  /* ---------- Title ---------- */
  /* ロゴ・サブタイトルは背景画像に焼き込み済み。HTML側でテキストは重ねない。
     画面の向きで背景を出し分け(縦=モバイル用 / 横=ワイド用)。読み込み失敗時は背景色でフォールバック。 */
  #screen-title{
    flex-direction:column; align-items:center; justify-content:flex-end;
    text-align:center; padding:0 20px 44px; cursor:pointer;
    background-color:#0b0a12;
    background-image:url('assets/images/bg-title-mobile.png');
    background-position:center; background-size:cover; background-repeat:no-repeat;
  }
  @media (orientation:landscape){
    #screen-title{ background-image:url('assets/images/bg-title.png'); }
  }
  .title-hint{
    font-family:"DotGothic16", monospace; font-size:14px; letter-spacing:.12em;
    color:#f4e4b8; background:rgba(10,8,16,0.55);
    border:1px solid rgba(232,196,104,0.35); border-radius:999px;
    padding:10px 24px; backdrop-filter:blur(2px);
    animation:blink 1.5s infinite;
  }
  .game-title{
    font-family:"DotGothic16", monospace;
    font-size:clamp(26px,7vw,40px);
    color:var(--gold);
    text-shadow:0 0 18px rgba(232,196,104,.5);
    margin:0 0 10px;
    letter-spacing:.06em;
  }
  .game-sub{ color:var(--text-soft); font-size:14px; margin-bottom:36px; max-width:360px; line-height:1.8; }
  .start-game-btn{
    font-family:"DotGothic16", monospace;
    font-size:18px; letter-spacing:.1em;
    background:linear-gradient(180deg, var(--gold), var(--gold-deep));
    color:#241C0A; border:none; border-radius:10px; padding:16px 46px; cursor:pointer;
    box-shadow:0 6px 0 #8a6a2c, 0 10px 18px rgba(0,0,0,.4);
    transition:transform .1s ease;
  }
  .start-game-btn:active{ transform:translateY(4px); box-shadow:0 2px 0 #8a6a2c; }

  /* ---------- 難易度選択 ---------- */
  #screen-difficulty{
    flex-direction:column; align-items:center; justify-content:center;
    text-align:center; padding:40px 20px;
    background:
      radial-gradient(circle at 30% 20%, rgba(232,196,104,0.12), transparent 45%),
      radial-gradient(circle at 80% 80%, rgba(127,176,224,0.10), transparent 45%),
      var(--bg-deep);
  }
  #screen-difficulty .game-sub{ margin-bottom:28px; }
  .difficulty-list{
    display:flex; flex-direction:column; gap:12px;
    width:100%; max-width:360px;
  }
  .difficulty-btn{
    display:flex; flex-direction:column; gap:5px; text-align:left;
    background:var(--window); color:var(--text);
    border:2px solid var(--gold-deep); border-radius:12px;
    padding:14px 16px; cursor:pointer;
    box-shadow:0 5px 0 #3a3357, 0 10px 18px rgba(0,0,0,.35);
    transition:transform .1s ease, box-shadow .1s ease, border-color .15s ease;
  }
  .difficulty-btn:active{ transform:translateY(3px); box-shadow:0 2px 0 #3a3357, 0 6px 12px rgba(0,0,0,.35); }
  .difficulty-btn.is-recommended{ border-color:var(--gold); box-shadow:0 5px 0 #8a6a2c, 0 10px 20px rgba(232,196,104,.18); }
  .difficulty-name{
    font-family:"DotGothic16", monospace; font-size:17px; color:var(--gold);
    display:flex; align-items:center; gap:8px; letter-spacing:.04em;
  }
  .difficulty-btn.is-hard{ border-color:#8a4a4a; box-shadow:0 5px 0 #3a2330, 0 10px 20px rgba(200,80,80,.16); }
  .difficulty-badge{
    font-family:"Zen Kaku Gothic New", sans-serif; font-weight:800; font-size:10.5px;
    background:var(--gold); color:#241C0A; border-radius:6px; padding:2px 8px; letter-spacing:0;
    white-space:nowrap;
  }
  .difficulty-badge.badge-rate{ background:#C85454; color:#fff; }
  .difficulty-desc{ font-size:12px; color:var(--text-soft); line-height:1.6; }
  .difficulty-tag{ font-size:11px; color:var(--gold); line-height:1.55; margin-top:1px; }
  .difficulty-tag.hard-flavor{ color:#E8A0A0; font-style:normal; }
  .difficulty-back{
    margin-top:22px; font-family:"DotGothic16", monospace; font-size:13px;
    background:transparent; color:var(--text-soft);
    border:1.5px solid rgba(255,255,255,.18); border-radius:9px; padding:9px 22px; cursor:pointer;
  }
  .difficulty-back:active{ transform:translateY(1px); }

  /* ---------- Story / dialogue ---------- */
  #screen-story{
    flex-direction:column; justify-content:flex-end; min-height:100vh; position:relative;
    transition:background 1.2s ease;
  }
  /* 区間ごとの背景。画像が読めない場合に備え、background-color とグラデーションをフォールバックとして残す */
  .bg-village{
    background-color:var(--bg-deep);
    background-image:
      radial-gradient(circle at 50% 30%, rgba(232,196,104,0.10), transparent 55%),
      linear-gradient(180deg, rgba(27,24,50,0.55), rgba(18,16,30,0.92));
  }
  .bg-prologue{
    background-color:#0f0d1a;
    background-image:
      linear-gradient(180deg, rgba(12,10,24,0.35), rgba(10,8,18,0.9)),
      url('assets/images/bg-prologue.png');
    background-position:center; background-size:cover; background-repeat:no-repeat;
  }
  .bg-prologue-2{
    background-color:#0d0b16;
    background-image:
      linear-gradient(180deg, rgba(12,10,24,0.35), rgba(10,8,18,0.9)),
      url('assets/images/bg-prologue-2.png');
    background-position:center; background-size:cover; background-repeat:no-repeat;
  }
  .bg-prologue-3{
    background-color:#140d12;
    background-image:
      linear-gradient(180deg, rgba(12,10,24,0.32), rgba(10,8,18,0.88)),
      url('assets/images/bg-prologue-3.png');
    background-position:center; background-size:cover; background-repeat:no-repeat;
  }
  .bg-epilogue{
    background-color:#1a1220;
    background-image:
      linear-gradient(180deg, rgba(18,16,30,0.3), rgba(18,16,30,0.88)),
      url('assets/images/bg-epilogue.png');
    background-position:center; background-size:cover; background-repeat:no-repeat;
  }
  .bg-epilogue-2{
    background-color:#171526;
    background-image:
      linear-gradient(180deg, rgba(18,16,30,0.28), rgba(18,16,30,0.82)),
      url('assets/images/bg-epilogue-2.png');
    background-position:center; background-size:cover; background-repeat:no-repeat;
  }
  .bg-epilogue-3{
    background-color:#1b1a28;
    background-image:
      linear-gradient(180deg, rgba(20,20,34,0.24), rgba(18,16,30,0.72)),
      url('assets/images/bg-epilogue-3.png');
    background-position:center; background-size:cover; background-repeat:no-repeat;
  }
  .bg-yamamichi{
    background-color:#2b2320;
    background-image:
      linear-gradient(180deg, rgba(18,16,30,0.25), rgba(18,16,30,0.85)),
      url('assets/images/bg-yamamichi.png');
    background-position:center; background-size:cover; background-repeat:no-repeat;
  }
  .bg-mori{
    background-color:#16241c;
    background-image:
      linear-gradient(180deg, rgba(18,16,30,0.25), rgba(18,16,30,0.85)),
      url('assets/images/bg-mori.png');
    background-position:center; background-size:cover; background-repeat:no-repeat;
  }
  .bg-cave{
    background-color:#161320;
    background-image:
      linear-gradient(180deg, rgba(18,16,30,0.25), rgba(18,16,30,0.85)),
      url('assets/images/bg-doukutsu.png');
    background-position:center; background-size:cover; background-repeat:no-repeat;
  }
  .bg-ruins{
    background-color:#241f1a;
    background-image:
      linear-gradient(180deg, rgba(18,16,30,0.25), rgba(18,16,30,0.85)),
      url('assets/images/bg-iseki.png');
    background-position:center; background-size:cover; background-repeat:no-repeat;
  }
  .bg-castle{
    background-color:#1c1424;
    background-image:
      linear-gradient(180deg, rgba(18,16,30,0.25), rgba(18,16,30,0.85)),
      url('assets/images/bg-maoujou.png');
    background-position:center; background-size:cover; background-repeat:no-repeat;
  }
  .bg-end{
    background-color:var(--bg-deep);
    background-image:
      radial-gradient(circle at 50% 40%, rgba(232,196,104,0.16), transparent 60%),
      linear-gradient(180deg, rgba(27,24,50,0.5), rgba(18,16,30,0.9));
  }

  .story-stage{ flex:1; display:flex; align-items:flex-end; justify-content:center; padding-bottom:10px; }
  .story-portrait{ width:120px; height:auto; image-rendering:pixelated; filter:drop-shadow(0 10px 16px rgba(0,0,0,.5)); }

  .dialogue-box{
    margin:0 14px 20px; padding:18px 20px 20px;
    background:var(--window);
    border:2px solid var(--gold-deep);
    border-radius:var(--radius);
    box-shadow:0 12px 30px rgba(0,0,0,.5);
    cursor:pointer;
    min-height:100px;
    position:relative;
    display:flex;
    align-items:center;
    gap:14px;
  }
  .dialogue-box.narration{ border-color:#575279; }
  .dialogue-portrait{
    width:56px; height:56px; flex-shrink:0; border-radius:10px; background:rgba(255,255,255,.05);
    display:flex; align-items:center; justify-content:center; overflow:hidden;
  }
  .dialogue-portrait img{ width:100%; height:100%; object-fit:contain; image-rendering:pixelated; }
  .dialogue-body{ flex:1; }
  .speaker-tag{
    display:inline-block; margin-bottom:6px;
    font-family:"DotGothic16", monospace;
    font-size:13px; padding:3px 14px; border-radius:8px;
    background:var(--gold); color:#241C0A; font-weight:700;
  }
  .dialogue-text{
    font-size:15.5px; line-height:1.85; white-space:pre-wrap;
  }
  .dialogue-text.narration-text{
    color:var(--text-soft); text-align:center; width:100%;
  }
  .next-hint{
    position:absolute; bottom:6px; right:16px; font-size:11.5px; color:var(--gold);
    animation:blink 1.3s infinite;
  }
  @keyframes blink{ 0%,100%{opacity:1;} 50%{opacity:.2;} }

  /* アイテム/装備 入手イベントのアイコンバッジ(テキストボックスの上に表示) */
  .get-item-badge{
    display:flex; flex-direction:column; align-items:center; gap:6px;
    padding:12px 18px 13px; margin-bottom:4px;
    background:rgba(29,27,51,0.88); border:2px solid var(--gold-deep); border-radius:14px;
    box-shadow:0 10px 26px rgba(0,0,0,.45);
    animation:getItemPop .38s ease both;
  }
  .get-item-badge img{
    width:clamp(64px,20vw,88px); height:clamp(64px,20vw,88px); object-fit:contain;
    image-rendering:auto; filter:drop-shadow(0 4px 10px rgba(0,0,0,.5));
  }
  .get-item-badge span{
    font-family:"DotGothic16", monospace; font-size:12px; color:var(--gold); letter-spacing:.06em;
  }
  @keyframes getItemPop{
    0%{ transform:scale(.6); opacity:0; }
    60%{ transform:scale(1.06); }
    100%{ transform:scale(1); opacity:1; }
  }

  /* ---------- Battle ---------- */
  #screen-battle{
    flex-direction:column; align-items:center; padding:14px 12px 20px; min-height:100vh;
    transition:background 1.2s ease;
  }
  /* 大画面でも戦闘UIが間延びしないよう中央に寄せる(モバイル表示は不変) */
  #screen-battle > *{ width:100%; max-width:600px; }
  .battle-field{
    display:flex; gap:10px; margin-bottom:10px;
    background:rgba(15,14,28,0.55); border-radius:12px; padding:10px;
  }
  .enemy-side{ flex:1; min-width:0; display:flex; align-items:center; }
  .enemy-panel{ text-align:center; width:100%; }
  .enemy-name{ font-family:"DotGothic16", monospace; font-size:16px; color:var(--enemy); margin-bottom:6px; }
  .enemy-avatar-row{ display:flex; flex-wrap:wrap; align-items:flex-end; justify-content:center; gap:6px; margin-bottom:8px; }
  .enemy-avatar{
    width:clamp(120px, 34vw, 168px); max-width:100%; height:auto; image-rendering:pixelated;
    filter:drop-shadow(0 0 18px rgba(232,100,100,.45));
    animation:enemyFloat 3.6s ease-in-out infinite;
  }
  .enemy-avatar.small{ width:clamp(64px, 19vw, 94px); }
  @keyframes enemyFloat{ 0%,100%{ transform:translateY(0); } 50%{ transform:translateY(-6px); } }
  .hp-bar-wrap{ width:100%; max-width:240px; margin:0 auto; }
  /* ステータス表示(名前/HP/MPバー)は面積を圧縮: バーは細く、余白と文字は小さく */
  .bar-track{ background:#0F0E1C; border-radius:6px; height:8px; overflow:hidden; border:1px solid rgba(255,255,255,.08); }
  .bar-fill{ height:100%; border-radius:6px; transition:width .3s ease; }
  .bar-fill.hp{ background:linear-gradient(90deg, var(--hp), #4FAF77); }
  .bar-fill.hp.low{ background:linear-gradient(90deg, var(--hp-low), #B8425A); }
  .bar-fill.mp{ background:linear-gradient(90deg, var(--mp), #3A82B8); }
  .bar-label{ font-size:10px; color:var(--text-soft); margin-top:2px; text-align:center; }

  /* パーティーは3人を横並びにして一人ひとりを大きく見せる */
  .party-row{ flex:1; min-width:0; display:flex; flex-direction:row; justify-content:center; gap:6px; align-items:stretch; }
  .member-card{
    flex:1 1 0; min-width:0; max-width:190px;
    background:var(--window); border:2px solid rgba(255,255,255,.06); border-radius:10px;
    padding:7px 4px 6px; text-align:center; transition:border-color .2s ease, opacity .2s ease;
  }
  .member-card.active-turn{ border-color:var(--gold); box-shadow:0 0 14px rgba(232,196,104,.35); }
  .member-card.fainted{ opacity:.35; }
  .member-card.covering{ border-color:var(--roi); }
  .member-avatar-wrap{
    width:100%; max-width:112px; aspect-ratio:1/1; height:auto;
    margin:0 auto 4px; display:flex; align-items:center; justify-content:center;
  }
  .member-avatar-wrap img{ width:100%; height:100%; object-fit:contain; image-rendering:pixelated; }
  .member-name{
    font-size:11px; font-weight:700; margin-bottom:3px;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .member-status{ font-size:9px; font-weight:700; color:var(--gold); margin-bottom:3px; line-height:1.2; }
  .member-card.fainted .member-status{ color:var(--enemy); }
  .member-hp-num{ font-size:9px; color:var(--text-soft); margin-top:1px; }

  .battle-log{
    background:#0F0E1C; border:1.5px solid rgba(255,255,255,.08); border-radius:10px;
    padding:8px 12px; font-size:12.5px; color:var(--text-soft); min-height:44px;
    margin-bottom:10px; line-height:1.65;
  }
  .battle-log strong{ color:var(--text); }

  .command-area{
    background:rgba(15,14,28,0.55); border-radius:12px; padding:10px;
  }
  .command-title{ font-size:12.5px; color:var(--gold); margin-bottom:8px; font-weight:700; }
  .command-grid{ display:grid; grid-template-columns:1fr 1fr; gap:8px; }

  @media (max-width:480px){
    .battle-field{ flex-direction:column; }
  }
  /* ごく狭い端末では3人分の横並びに合わせて文字をさらに詰める */
  @media (max-width:340px){
    .member-name{ font-size:10px; }
    .member-hp-num{ font-size:8.5px; }
    .enemy-avatar{ width:clamp(104px, 40vw, 140px); }
    .enemy-avatar.boss{ width:clamp(140px, 54vw, 190px); }
  }
  .cmd-btn{
    font-family:"Zen Kaku Gothic New", sans-serif; font-weight:800; font-size:14px;
    background:var(--window); border:1.5px solid var(--gold-deep); color:var(--text);
    border-radius:10px; padding:13px 8px; cursor:pointer; transition:all .12s ease;
  }
  .cmd-btn:disabled{ opacity:.35; cursor:not-allowed; }
  .cmd-btn:not(:disabled):active{ transform:scale(0.96); }
  .cmd-btn.attack{ border-color:#E8607A; }
  .cmd-btn.magic{ border-color:#5AA9E6; }
  .cmd-btn.defend{ border-color:#6FCF97; }
  .cmd-btn.item{ border-color:var(--gold); }

  .battle-overlay{
    position:fixed; inset:0; background:rgba(10,9,20,0.88);
    display:none; align-items:center; justify-content:center; flex-direction:column; z-index:20;
    text-align:center; padding:20px;
  }
  .battle-overlay.show{ display:flex; }
  .overlay-title{ font-family:"DotGothic16", monospace; font-size:28px; margin-bottom:14px; }
  .overlay-title.win{ color:var(--gold); text-shadow:0 0 20px rgba(232,196,104,.5); }
  .overlay-title.lose{ color:var(--enemy); }
  .overlay-desc{ color:var(--text-soft); font-size:13.5px; margin-bottom:22px; max-width:300px; line-height:1.8; }

  /* ---------- ボス登場演出 ---------- */
  /* 戦闘状態は startBattle() 側で同期的に構築済み。この層は純粋に視覚演出で、
     自動プレイ(Node VM 通しシミュレーション)の進行はブロックしない。 */
  .boss-intro{
    position:fixed; inset:0; z-index:30;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px;
    padding:24px; text-align:center;
    background-color:#07060d;
    background-image:radial-gradient(circle at 50% 42%, rgba(96,20,30,0.55), rgba(7,6,13,0.9) 70%);
    opacity:0; pointer-events:none; transition:opacity .4s ease;
  }
  .boss-intro.show{ opacity:1; pointer-events:auto; }
  .boss-intro-imgwrap{ width:min(78vw,340px); max-height:52vh; display:flex; align-items:center; justify-content:center; }
  .boss-intro-imgwrap img{
    width:100%; height:auto; max-height:52vh; object-fit:contain; image-rendering:pixelated;
    filter:drop-shadow(0 0 34px rgba(232,60,60,.6));
  }
  .boss-intro.show .boss-intro-imgwrap img{ animation:bossIntroImg .7s cubic-bezier(.18,.9,.32,1.2) both; }
  .boss-intro-name{
    font-family:"DotGothic16", monospace; font-size:clamp(30px,9vw,52px); color:#F04B4B;
    letter-spacing:.08em; text-shadow:0 0 22px rgba(232,40,40,.7), 0 3px 0 rgba(0,0,0,.5);
  }
  .boss-intro.show .boss-intro-name{ animation:bossIntroRise .5s ease .18s both; }
  .boss-intro-line{ font-size:clamp(13px,3.6vw,16px); color:var(--text-soft); line-height:1.9; max-width:340px; }
  .boss-intro.show .boss-intro-line{ animation:bossIntroRise .5s ease .5s both; }
  .boss-intro-skip{ position:absolute; bottom:22px; font-size:11.5px; color:var(--gold); animation:blink 1.3s infinite; }
  @keyframes bossIntroImg{ 0%{ transform:scale(.35) translateY(24px); opacity:0; } 100%{ transform:scale(1) translateY(0); opacity:1; } }
  @keyframes bossIntroRise{ 0%{ transform:translateY(14px); opacity:0; } 100%{ transform:translateY(0); opacity:1; } }

  /* 戦闘中のボスは雑魚(単体 最大168px)より一回り大きく表示。レイアウトは既存のまま */
  .enemy-avatar.boss{ width:clamp(160px, 46vw, 224px); filter:drop-shadow(0 0 26px rgba(232,72,72,.55)); }

  /* ---------- 準備画面 ---------- */
  .prep-open-btn{
    position:absolute; top:12px; right:12px; z-index:6;
    font-family:"DotGothic16", monospace; font-size:12.5px; letter-spacing:.04em;
    background:rgba(29,27,51,0.92); color:var(--gold);
    border:1.5px solid var(--gold-deep); border-radius:9px;
    padding:8px 13px; cursor:pointer; box-shadow:0 4px 12px rgba(0,0,0,.4);
  }
  .prep-open-btn:active{ transform:translateY(1px); }

  #screen-prep{
    flex-direction:column; align-items:center;
    padding:18px 12px 44px; min-height:100vh; overflow-y:auto;
    background:
      radial-gradient(circle at 50% 0%, rgba(232,196,104,0.08), transparent 55%),
      linear-gradient(180deg, var(--bg-deep-2), var(--bg-deep));
  }
  .prep-inner{ width:100%; max-width:600px; }
  .prep-header{ display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; }
  .prep-title{
    font-family:"DotGothic16", monospace; font-size:22px; color:var(--gold);
    text-shadow:0 0 14px rgba(232,196,104,.4);
  }

// ※ bgm-prep.mp3(準備画面用)は openPrep()/closePrep() 側で setBgm("bgm-prep") として使用。
// ※ "bgm-opening"(タイトル明け〜難易度選択)は openDifficultySelect() で、
//    "bgm-prologue"(本編プロローグ)は region マップ経由の renderScene() で切り替わる。
//    どちらも実体は assets/bgm/ 配下(BGM.customPath 参照)。

const audioMgr = { track:null, name:null, desired:null, unlocked:false };

function fadeAudio(audio, from, to, ms, done){
  const steps = 20;
  const stepMs = Math.max(16, ms / steps);
  let i = 0;
  if(audio._fadeTimer) clearInterval(audio._fadeTimer);
  audio.volume = Math.min(1, Math.max(0, from));
  audio._fadeTimer = setInterval(()=>{
    i++;
    audio.volume = Math.min(1, Math.max(0, from + (to - from) * (i / steps)));
    if(i >= steps){
      clearInterval(audio._fadeTimer);
      audio._fadeTimer = null;
      if(done) done();
    }
  }, stepMs);
}

function applyBgm(){
  const target = audioMgr.desired;
  if(audioMgr.name === target) return; // 既に同じ曲が流れている
  const old = audioMgr.track;
  if(old){
    fadeAudio(old, old.volume, 0, BGM.fadeMs, ()=>{ try{ old.pause(); }catch(e){} });
  }
  audioMgr.track = null;
  audioMgr.name = target;
  if(!target) return; // 無音区間
  const src = (BGM.customPath && BGM.customPath[target]) || (BGM.path + target + ".mp3");
  const next = new Audio(src);
  next.loop = (BGM.noLoop.indexOf(target) < 0); // エンディング曲などは1回再生で停止
  next.volume = 0;
  const p = next.play();
  if(p && p.catch) p.catch(()=>{}); // 再生できない環境では無視
  fadeAudio(next, 0, BGM.volume, BGM.fadeMs);
  audioMgr.track = next;
}

// 流したいBGMを指定する。初回操作前は予約だけして、操作時に再生を開始する。
function setBgm(baseName){
  audioMgr.desired = baseName || null;
  if(audioMgr.unlocked) applyBgm();
}

function unlockAudio(){
  if(audioMgr.unlocked) return;
  audioMgr.unlocked = true;
  applyBgm();
}
document.addEventListener("pointerdown", unlockAudio, { once:true });
document.addEventListener("touchend",   unlockAudio, { once:true });
document.addEventListener("keydown",    unlockAudio, { once:true });

// 全回復するかどうかは難易度(state.difficulty)で決まる。
function healPartyFully(){
  Object.keys(state.partyStats).forEach(id=>{
    const base = PARTY_MASTER[id];

  });
}

// STORY の各チェックポイントイベントから呼ぶ。kind: "milestone"(節目) / "interim"(区間内の小休止)
function checkpointReached(kind){
  const d = DIFFICULTY[state.difficulty] || DIFFICULTY.normal;
  const fullHeal = d.healAll || (kind === "milestone" && d.healMilestone);
  if(fullHeal){
    healPartyFully();
  } else if(state.inventory.herb <= 0 && state.inventory.lifeRoot <= 0){
    // このチェックポイントで全回復しない難易度では、回復手段を1つも持たずに低HPで固定され
    // 立て直せなくなる(=詰み)ことがある。やくそう/げんきのねっこ が両方0のときに限り、
    // げんきのねっこ1個を保証して復帰可能にする。
    // ※ ドロップ率・回復量・敵ステータスは一切変更しない、純粋な詰み防止措置
    //   (魔王城手前チェックポイントの既存ガードと同じ考え方)。
    state.inventory.lifeRoot = 1;
  }
  saveCheckpoint();
}

function saveCheckpoint(){
  checkpoint = {
    sceneIndex: sceneIndex,
    bg: currentBg,
    inventory: { ...state.inventory },
    partyStats: JSON.parse(JSON.stringify(state.partyStats)),
    heroLearnedMagic: state.heroLearnedMagic,
    heroWeaponTier: state.heroWeaponTier,
    ariaMagicBoost: state.ariaMagicBoost,
    roiShieldObtained: state.roiShieldObtained,
    holyCharmObtained: state.holyCharmObtained,
    equipOwner: { ...state.equipOwner }, // 準備画面での装備割り当ても保存対象に含める
    difficulty: state.difficulty
  };
}

function restoreCheckpoint(){
  if(!checkpoint) return;
  sceneIndex = checkpoint.sceneIndex;
  currentBg = checkpoint.bg;
  state.inventory = { ...checkpoint.inventory };
  state.partyStats = JSON.parse(JSON.stringify(checkpoint.partyStats));
  state.heroLearnedMagic = checkpoint.heroLearnedMagic;
  state.heroWeaponTier = checkpoint.heroWeaponTier;
  state.ariaMagicBoost = checkpoint.ariaMagicBoost;
  state.roiShieldObtained = checkpoint.roiShieldObtained;
  state.holyCharmObtained = checkpoint.holyCharmObtained;
  state.equipOwner = { ...(checkpoint.equipOwner || DEFAULT_EQUIP_OWNER) };
  if(checkpoint.difficulty) state.difficulty = checkpoint.difficulty;
}

const screens = {
  title: document.getElementById("screen-title"),
  difficulty: document.getElementById("screen-difficulty"),
  story: document.getElementById("screen-story"),
  battle: document.getElementById("screen-battle"),
  prep: document.getElementById("screen-prep"),
  end: document.getElementById("screen-end")
};

function showScreen(name){
  Object.values(screens).forEach(s => s.classList.remove("show"));
  screens[name].classList.add("show");
}

/* ===================== ゲーム開始 / リスタート ===================== */
// タイトル画面のタップ: 初回タップで音声を解禁し、難易度選択へ進む
function enterFromTitle(){
  unlockAudio();          // この最初のタップを音声解禁のトリガーにする
  openDifficultySelect(); // タイトル → 難易度選択 → プロローグ → 村 の順
}

// オープニングの難易度選択画面へ
function openDifficultySelect(){
  // クリア率の表示を HARD_CLEAR_RATE の1箇所から流し込む
  const rateEls = document.querySelectorAll ? document.querySelectorAll(".js-hard-rate") : [];
  Array.prototype.forEach.call(rateEls, el => { el.textContent = HARD_CLEAR_RATE; });
  // タイトル明け〜オープニング〜難易度選択の間はオープニング曲をループ。
  // (初回はこの直前に enterFromTitle() が unlockAudio() 済みなので即再生。
  //  エンディングからの「もう一度」でもここを通り、クロスフェードでオープニング曲へ戻る)
  setBgm("bgm-opening");
  showScreen("difficulty");
}

// 難易度を選んで冒険開始
function chooseDifficulty(key){
  startGame(DIFFICULTY[key] ? key : "normal");
}

function startGame(difficultyKey){
  state = freshState();
  if(difficultyKey && DIFFICULTY[difficultyKey]) state.difficulty = difficultyKey;
  sceneIndex = 0;
  currentBg = "bg-village";
  checkpoint = null;
  saveCheckpoint(); // 冒険の開始地点を最初のチェックポイントとする
  showScreen("story");
  renderScene();
}
// 「もう一度はじめから」→ 難易度を選び直せるように選択画面へ戻す
function restartGame(){ openDifficultySelect(); }

/* ===================== ストーリー進行 ===================== */
function renderScene(){
  const scene = STORY[sceneIndex];
  if(!scene) return;
  if(scene.effect) scene.effect();

  if(scene.type === "battle"){
    startBattle(scene.battleId);
    return;
  }
  if(scene.type === "end"){
    setBgm(BGM.region["bg-end"]);
    document.getElementById("end-text").textContent = "ユウトたちの物語は、ここで一区切り。もう一度最初から冒険をやり直すこともできます。";
    showScreen("end");
    return;
  }

  showScreen("story");
  if(scene.bg){ currentBg = scene.bg; }
  screens.story.className = "screen show " + currentBg;
  setBgm(BGM.region[currentBg]); // 区間に対応した道中BGMへ(フェード切り替え)

  const stage = document.getElementById("story-stage");
  const box = document.getElementById("dialogue-box");
  const portraitWrap = document.getElementById("dialogue-portrait");
  const tag = document.getElementById("speaker-tag");
  const text = document.getElementById("dialogue-text");

  stage.innerHTML = "";

  if(scene.type === "dialogue"){
    box.classList.remove("narration");
    tag.style.display = "inline-block";
    tag.textContent = scene.speaker;
    text.classList.remove("narration-text");

    const portraitSrc = PORTRAITS[scene.speaker];
    if(portraitSrc){
      const smoothStyle = portraitSrc.endsWith(".png") ? ' style="image-rendering:auto;"' : "";
      portraitWrap.style.display = "flex";
      portraitWrap.innerHTML = '<img src="' + portraitSrc + '" alt="' + scene.speaker + '"' + smoothStyle + '>';
      stage.innerHTML = '<img class="story-portrait" src="' + portraitSrc + '" alt="' + scene.speaker + '"' + smoothStyle + '>';
    } else {
      portraitWrap.style.display = "none";
      portraitWrap.innerHTML = "";
    }
  } else {
    box.classList.add("narration");
    tag.style.display = "none";
    text.classList.add("narration-text");
    portraitWrap.style.display = "none";
    portraitWrap.innerHTML = "";

    if(scene.image){
      stage.innerHTML = '<img class="story-portrait" style="width:70%;max-width:260px;image-rendering:auto;" src="' + scene.image + '" alt="' + (scene.imageAlt || "") + '">';
    } else if(scene.icon){
      // アイテム/装備の入手イベント: テキストの上にアイコンを表示。
      // 画像が無い/読めない場合は onerror でバッジごと非表示にする(フォールバック)。
      const iconSrc = eventIconSrc(scene.icon);
      if(iconSrc){
        stage.innerHTML = '<div class="get-item-badge">'
          + '<img src="' + iconSrc + '" alt="入手したアイテム" onerror="this.parentNode.style.display=\'none\'">'
          + '<span>手に入れた！</span>'
          + '</div>';
      }
    }
  }
  text.textContent = scene.text;
}

function nextScene(){
  sceneIndex++;
  renderScene();
}

/* ===================== 戦闘 ===================== */
let bossIntroTimer = null;

/* ボス登場演出。戦闘状態は startBattle() 側で同期的に構築済みなので、これは純粋な
   視覚オーバーレイ。setTimeout が使えない環境(Node VM シミュレーション)でも
   戦闘ロジックは既に動作可能で、進行はブロックされない。 */
function showBossIntro(battleId){
  const el = document.getElementById("boss-intro");
  const cfg = BATTLES[battleId];
  if(!el || !el.classList || !cfg) return;
  const img = document.getElementById("boss-intro-img");
  const nameEl = document.getElementById("boss-intro-name");
  const lineEl = document.getElementById("boss-intro-line");
  if(img) img.src = cfg.enemy.imgs[0];
  if(nameEl) nameEl.textContent = cfg.enemy.name;
  if(lineEl) lineEl.textContent = BOSS_INTRO_LINES[battleId] || "";
  el.classList.add("show");
  if(bossIntroTimer && typeof clearTimeout === "function") clearTimeout(bossIntroTimer);
  bossIntroTimer = (typeof setTimeout === "function") ? setTimeout(skipBossIntro, 2800) : null;
}
function skipBossIntro(){
  if(bossIntroTimer && typeof clearTimeout === "function") clearTimeout(bossIntroTimer);
  bossIntroTimer = null;
  const el = document.getElementById("boss-intro");
  if(el && el.classList) el.classList.remove("show");
}

function startBattle(battleId){
  currentBattleId = battleId;
  itemMenuOpen = false;
  magicMenuOpen = false;
  pendingHealTarget = null;
  skipBossIntro(); // 前の演出が残っていれば消す
  setBgm(BOSS_BATTLE_IDS.includes(battleId) ? BGM.battleBoss : BGM.battleNormal);
  const cfg = BATTLES[battleId];
  const HERO_WEAPON_ATK_BONUS = { 0:0, 1:3, 2:8 };
  const eq = state.equipOwner || DEFAULT_EQUIP_OWNER;
  const members = cfg.partyIds.map(id=>{
    const base = PARTY_MASTER[id];
    // パーティー加入直後は満タンで開始、以降はゲーム全体でHP/MPを引き継ぐ(戦闘ごとの全回復はしない)
    if(!state.partyStats[id]){
      state.partyStats[id] = { hp: base.maxHp, mp: base.maxMp };
    }
    const saved = state.partyStats[id];
    // 装備効果は準備画面での割り当て(state.equipOwner)に従って対象を決める。
    // 既定の割り当て(sword→hero / bracelet→aria / shield→roi)なら従来の挙動と一致する。
    const atkBonus = (state.heroWeaponTier > 0 && eq.sword === id) ? HERO_WEAPON_ATK_BONUS[state.heroWeaponTier] : 0;
    // 呪文リストを複製。ユウトはファイア習得前は魔法なし。
    let spells = (base.spells && !(id === "hero" && !state.heroLearnedMagic))
      ? base.spells.map(sp => ({ ...sp }))
      : null;
    // 魔力のブレスレット: 装備者の「攻撃魔法」の威力 +4(回復魔法には影響しない)
    if(spells && state.ariaMagicBoost && eq.bracelet === id){
      spells.forEach(sp => { if(sp.type === "attack") sp.power += 4; });
    }
    return {
      key:id, name:base.name, img:base.img,
      maxHp:base.maxHp, hp:saved.hp,
      maxMp:base.maxMp, mp:saved.mp,
      atk: base.atk + atkBonus,
      spells: spells,
      magic: spells ? (spells.find(sp => sp.type === "attack") || null) : null, // 後方互換: 攻撃魔法への別名
      skill: base.skill || null,
      hasIronShield: (state.roiShieldObtained && eq.shield === id),
      defending:false, covering:false, alive: saved.hp > 0
    };
  });
  // 前の戦闘で戦闘不能のまま(HP0で)連戦に入ると、先頭メンバーが倒れている場合がある。
  // その状態で turnIndex=0 のままだとコマンドが出せず進行不能になるため、最初の生存者から始める。
  let firstAlive = 0;
  while(firstAlive < members.length && !members[firstAlive].alive){ firstAlive++; }
  battleState = {
    enemy:{ name:cfg.enemy.name, hp:cfg.enemy.maxHp, maxHp:cfg.enemy.maxHp, atk:cfg.enemy.atk, imgs:cfg.enemy.imgs, attacksPerRound:cfg.enemy.attacksPerRound || 1 },
    members, turnIndex: (firstAlive < members.length ? firstAlive : 0),
    log:[cfg.enemy.name + "が現れた！"]
  };
  showScreen("battle");
  screens.battle.classList.remove(...BG_CLASSES);
  screens.battle.classList.add(currentBg);
  document.getElementById("battle-overlay").classList.remove("show");
  renderBattle();
  // ボス戦は通常戦闘画面の手前に登場演出を挟む(BGM は上で既にボス曲へ切替済み)
  if(BOSS_BATTLE_IDS.includes(battleId)){ showBossIntro(battleId); }
}

function randDamage(power){
  return Math.max(1, Math.round(power * (0.85 + Math.random()*0.3)));
}

function currentActor(){ return battleState.members[battleState.turnIndex]; }

function renderBattle(){
  const b = battleState;
  document.getElementById("enemy-name").textContent = b.enemy.name;
  const avatarRow = document.getElementById("enemy-avatar-row");
  const isBoss = BOSS_BATTLE_IDS.includes(currentBattleId);
  avatarRow.innerHTML = b.enemy.imgs.map(src =>
    '<img class="enemy-avatar' + (b.enemy.imgs.length>1 ? ' small' : '') + (isBoss ? ' boss' : '') + '" src="' + src + '" alt="' + b.enemy.name + '">'
  ).join("");

  const enemyPct = Math.max(0, (b.enemy.hp / b.enemy.maxHp) * 100);
  const enemyFill = document.getElementById("enemy-hp-fill");
  enemyFill.style.width = enemyPct + "%";
  enemyFill.className = "bar-fill hp" + (enemyPct <= 30 ? " low" : "");
  document.getElementById("enemy-hp-label").textContent = "HP " + Math.max(0,b.enemy.hp) + " / " + b.enemy.maxHp;

  const partyRow = document.getElementById("party-row");
  partyRow.innerHTML = "";
  b.members.forEach((m, idx)=>{
    const card = document.createElement("div");
    card.className = "member-card"
      + (idx === b.turnIndex && m.alive ? " active-turn" : "")
      + (!m.alive ? " fainted" : "")
      + (m.covering ? " covering" : "");
    const hpPct = Math.max(0,(m.hp / m.maxHp) * 100);
    const statusLabel = !m.alive ? "戦闘不能" : (m.covering ? "かばう中" : "");
    card.innerHTML = `
      <div class="member-avatar-wrap"><img src="${m.img}" alt="${m.name}"></div>
      <div class="member-name">${m.name}</div>
      ${statusLabel ? `<div class="member-status">${statusLabel}</div>` : ""}
      <div class="bar-track"><div class="bar-fill ${hpPct<=30?'hp low':'hp'}" style="width:${hpPct}%;"></div></div>
      <div class="member-hp-num">HP ${m.hp}/${m.maxHp}</div>
      ${m.maxMp>0 ? `<div class="bar-track" style="margin-top:3px;"><div class="bar-fill mp" style="width:${(m.mp/m.maxMp)*100}%;"></div></div><div class="member-hp-num">MP ${m.mp}/${m.maxMp}</div>` : ""}
    `;
    partyRow.appendChild(card);
  });

  document.getElementById("battle-log").innerHTML = b.log.slice(-4).map(l=>"・"+l).join("<br>");

  const actor = currentActor();
  const cmdTitle = document.getElementById("command-title");
  const cmdGrid = document.getElementById("command-grid");
  if(!actor || !actor.alive){
    cmdTitle.textContent = "";
    cmdGrid.innerHTML = "";
    return;
  }
  cmdGrid.innerHTML = "";

  if(itemMenuOpen){
    cmdTitle.textContent = "どうぐをえらぶ";
    renderItemMenu(cmdGrid);
    return;
  }

  if(magicMenuOpen){
    cmdTitle.textContent = pendingHealTarget ? "だれに かける？" : "まほうを えらぶ";
    renderMagicMenu(cmdGrid);
    return;
  }

  cmdTitle.textContent = actor.name + " のターン";

  const atkBtn = document.createElement("button");
  atkBtn.className = "cmd-btn attack";
  atkBtn.textContent = "たたかう";
  atkBtn.onclick = doAttack;
  cmdGrid.appendChild(atkBtn);

  const secondBtn = document.createElement("button");
  secondBtn.className = "cmd-btn magic";
  const spells = actor.spells || [];
  if(spells.length === 1){
    // 呪文が1つ(ユウトのファイア)なら直接発動
    const sp = spells[0];
    secondBtn.textContent = sp.name + "(MP" + sp.cost + ")";
    secondBtn.disabled = actor.mp < sp.cost;
    secondBtn.onclick = doMagic;
  } else if(spells.length > 1){
    // 複数(アリア)なら呪文選択サブメニューを開く
    secondBtn.textContent = "まほう";
    secondBtn.disabled = !spells.some(sp => actor.mp >= sp.cost);
    secondBtn.onclick = () => { magicMenuOpen = true; pendingHealTarget = null; renderBattle(); };
  } else if(actor.skill){
    secondBtn.textContent = actor.skill.name;
    secondBtn.disabled = actor.covering;
    secondBtn.onclick = doGuardSkill;
  } else {
    secondBtn.textContent = "まほう(未習得)";
    secondBtn.disabled = true;
  }
  cmdGrid.appendChild(secondBtn);

  const defBtn = document.createElement("button");
  defBtn.className = "cmd-btn defend";
  defBtn.textContent = "ぼうぎょ";
  defBtn.onclick = doDefend;
  cmdGrid.appendChild(defBtn);

  const itemBtn = document.createElement("button");
  itemBtn.className = "cmd-btn item";
  itemBtn.textContent = "どうぐ";
  const totalItems = state.inventory.herb + state.inventory.manaDrop + state.inventory.lifeRoot;
  itemBtn.disabled = totalItems <= 0;
  itemBtn.onclick = () => { itemMenuOpen = true; renderBattle(); };
  cmdGrid.appendChild(itemBtn);
}

function lowestHpAliveMember(){
  const alive = battleState.members.filter(m=>m.alive);
  if(alive.length === 0) return null;
  return alive.reduce((a,b)=> (a.hp/a.maxHp) <= (b.hp/b.maxHp) ? a : b);
}

function lowestMpAliveMember(){
  const alive = battleState.members.filter(m=>m.alive && m.maxMp > 0);
  if(alive.length === 0) return null;
  return alive.reduce((a,b)=> (a.mp/a.maxMp) <= (b.mp/b.maxMp) ? a : b);
}

function someoneNeedsHeal(){
  return battleState.members.some(m => m.alive && m.hp < m.maxHp);
}

function renderMagicMenu(cmdGrid){
  const actor = currentActor();

  if(pendingHealTarget){
    // 単体回復(ヒール)の対象を選ぶ
    battleState.members.filter(m => m.alive).forEach(m => {
      const btn = document.createElement("button");
      btn.className = "cmd-btn magic";
      btn.textContent = m.name + " HP" + m.hp + "/" + m.maxHp;
      btn.disabled = m.hp >= m.maxHp; // 満タンには使えない
      btn.onclick = () => castHealOne(m.key);
      cmdGrid.appendChild(btn);
    });
  } else {
    (actor.spells || []).forEach(sp => {
      const btn = document.createElement("button");
      btn.className = "cmd-btn magic";
      const suffix = sp.type === "heal-all" ? "(全体)" : (sp.type === "heal-one" ? "(単体)" : "");
      btn.textContent = sp.name + suffix + " MP" + sp.cost;
      let dis = actor.mp < sp.cost;
      if(sp.type !== "attack" && !someoneNeedsHeal()) dis = true; // 回復不要なら選べない
      btn.disabled = dis;
      btn.onclick = () => selectSpell(sp.key);
      cmdGrid.appendChild(btn);
    });
  }

  const backBtn = document.createElement("button");
  backBtn.className = "cmd-btn defend";
  backBtn.textContent = "もどる";
  backBtn.onclick = () => {
    if(pendingHealTarget) pendingHealTarget = null;
    else magicMenuOpen = false;
    renderBattle();
  };
  cmdGrid.appendChild(backBtn);
}

function renderItemMenu(cmdGrid){
  Object.keys(ITEM_DEFS).forEach(key=>{
    const count = state.inventory[key];
    if(count <= 0) return;
    const def = ITEM_DEFS[key];
    const btn = document.createElement("button");
    btn.className = "cmd-btn item";
    btn.textContent = def.name + "(" + count + ")";
    if(def.kind === "mp" && !lowestMpAliveMember()){
      btn.disabled = true;
    } else {
      btn.onclick = () => useItem(key);
    }
    cmdGrid.appendChild(btn);
  });

  const backBtn = document.createElement("button");
  backBtn.className = "cmd-btn defend";
  backBtn.textContent = "もどる";
  backBtn.onclick = () => { itemMenuOpen = false; renderBattle(); };
  cmdGrid.appendChild(backBtn);
}

function useItem(key){
  if(state.inventory[key] <= 0) return;
  const actor = currentActor();
  let msg;
  if(key === "herb"){
    const target = lowestHpAliveMember();
    const healed = Math.min(target.maxHp - target.hp, 25);
    target.hp += healed;
    msg = actor.name + "はやくそうを使った！ " + target.name + "のHPが" + healed + "回復した！";
  } else if(key === "manaDrop"){
    const target = lowestMpAliveMember();
    if(!target) return;
    const healed = Math.min(target.maxMp - target.mp, 15);
    target.mp += healed;
    msg = actor.name + "はマナのしずくを使った！ " + target.name + "のMPが" + healed + "回復した！";
  } else if(key === "lifeRoot"){
    const target = lowestHpAliveMember();
    const healed = target.maxHp - target.hp;
    target.hp = target.maxHp;
    msg = actor.name + "はげんきのねっこを使った！ " + target.name + "のHPが" + healed + "回復した！";
  }
  state.inventory[key]--;
  pushLog(msg);
  itemMenuOpen = false;
  advanceTurn();
}

function doAttack(){
  const actor = currentActor();
  const dmg = randDamage(actor.atk);
  battleState.enemy.hp = Math.max(0, battleState.enemy.hp - dmg);
  pushLog(actor.name + "の攻撃！ " + battleState.enemy.name + "に" + dmg + "のダメージ！");
  afterPlayerAction();
}

// 呪文が1つのキャラ(ユウト)の直接発動用。攻撃魔法を優先して撃つ。
function doMagic(){
  const actor = currentActor();
  const list = actor.spells || [];
  const sp = list.find(s => s.type === "attack") || list[0];
  if(sp) selectSpell(sp.key);
}

function selectSpell(key){
  const actor = currentActor();
  const sp = (actor.spells || []).find(s => s.key === key);
  if(!sp || actor.mp < sp.cost) return;
  if(sp.type === "heal-one"){ pendingHealTarget = key; renderBattle(); return; }
  if(sp.type === "heal-all"){ applyHealAll(sp); return; }
  applyAttackSpell(sp);
}

function applyAttackSpell(sp){
  const actor = currentActor();
  if(actor.mp < sp.cost) return;
  actor.mp -= sp.cost;
  const dmg = randDamage(sp.power);
  battleState.enemy.hp = Math.max(0, battleState.enemy.hp - dmg);
  pushLog(actor.name + "の" + sp.name + "！ " + battleState.enemy.name + "に" + dmg + "のダメージ！");
  magicMenuOpen = false; pendingHealTarget = null;
  afterPlayerAction();
}

function castHealOne(targetKey){
  const actor = currentActor();
  const sp = (actor.spells || []).find(s => s.type === "heal-one");
  if(!sp || actor.mp < sp.cost) return;
  const target = battleState.members.find(m => m.key === targetKey && m.alive);
  if(!target) return;
  actor.mp -= sp.cost;
  const healed = Math.min(target.maxHp - target.hp, sp.power);
  target.hp += healed;
  pushLog(actor.name + "の" + sp.name + "！ " + target.name + "のHPが" + healed + "回復した！");
  magicMenuOpen = false; pendingHealTarget = null;
  advanceTurn();
}

function applyHealAll(sp){
  const actor = currentActor();
  if(actor.mp < sp.cost) return;
  actor.mp -= sp.cost;
  let total = 0;
  battleState.members.filter(m => m.alive).forEach(m => {
    const h = Math.min(m.maxHp - m.hp, sp.power);
    m.hp += h; total += h;
  });
  pushLog(actor.name + "の" + sp.name + "！ 味方全員のHPが" + sp.power + "回復した！");
  magicMenuOpen = false; pendingHealTarget = null;
  advanceTurn();
}

function doGuardSkill(){
  const actor = currentActor();
  battleState.members.forEach(m=> m.covering = false);
  actor.covering = true;
  pushLog(actor.name + "は「" + actor.skill.name + "」の構えを見せた！ 次の攻撃を引きつける！");
  advanceTurn();
}

function doDefend(){
  const actor = currentActor();
  actor.defending = true;
  pushLog(actor.name + "は身を守っている。");
  advanceTurn();
}

function pushLog(msg){ battleState.log.push(msg); }

function afterPlayerAction(){
  if(battleState.enemy.hp <= 0){
    renderBattle();
    onVictory();
    return;
  }
  advanceTurn();
}

function advanceTurn(){
  battleState.turnIndex++;
  while(battleState.turnIndex < battleState.members.length && !battleState.members[battleState.turnIndex].alive){
    battleState.turnIndex++;
  }
  if(battleState.turnIndex >= battleState.members.length){
    enemyTurn();
  } else {
    renderBattle();
  }
}

function enemyTurn(){
  if(battleState.members.every(m=>!m.alive)){ onDefeat(); return; }
  const attacksPerRound = battleState.enemy.attacksPerRound || 1;
  for(let i=0; i<attacksPerRound; i++){
    const alive = battleState.members.filter(m=>m.alive);
    if(alive.length === 0) break;
    const coveringMember = alive.find(m=>m.covering);
    const target = coveringMember || alive[Math.floor(Math.random()*alive.length)];
    let dmg = randDamage(battleState.enemy.atk);
    if(target.defending) dmg = Math.round(dmg * 0.5);
    if(target.hasIronShield) dmg = Math.floor(dmg * 0.8);
    if(state.holyCharmObtained) dmg = Math.floor(dmg * 0.9);
    target.hp = Math.max(0, target.hp - dmg);
    pushLog(battleState.enemy.name + "の攻撃！ " + target.name + "に" + dmg + "のダメージ！"
      + (target.defending ? "(防御で軽減)" : "")
      + (coveringMember ? "(かばって受け止めた！)" : ""));
    if(target.hp <= 0){
      target.alive = false;
      pushLog(target.name + "は倒れてしまった……");
    }
  }
  battleState.members.forEach(m=>{ m.defending = false; m.covering = false; });
  battleState.turnIndex = 0;
  while(battleState.turnIndex < battleState.members.length && !battleState.members[battleState.turnIndex].alive){
    battleState.turnIndex++;
  }
  if(battleState.members.every(m=>!m.alive)){
    renderBattle();
    onDefeat();
    return;
  }
  renderBattle();
}

function rollItemDrop(){
  if(Math.random() < 0.10){ state.inventory.lifeRoot++; return "げんきのねっこ"; }
  if(Math.random() < 0.25){ state.inventory.manaDrop++; return "マナのしずく"; }
  if(Math.random() < 0.40){ state.inventory.herb++; return "やくそう"; }
  return null;
}

function onVictory(){
  // 戦闘終了時点のHP/MPを永続状態へ書き戻す(次の戦闘にそのまま引き継ぐため)
  battleState.members.forEach(m=>{ state.partyStats[m.key] = { hp: m.hp, mp: m.mp }; });
  const overlay = document.getElementById("battle-overlay");
  document.getElementById("overlay-title").className = "overlay-title win";
  document.getElementById("overlay-title").textContent = "勝利！";
  let desc = battleState.enemy.name + "を倒した！";
  if(ZAKO_BATTLE_IDS.includes(currentBattleId)){
    const item = rollItemDrop();
    if(item) desc += " " + item + "を手に入れた！";
  }
  document.getElementById("overlay-desc").textContent = desc;
  const btn = document.getElementById("overlay-btn");
  btn.textContent = "つづきへ";
  btn.onclick = () => { overlay.classList.remove("show"); nextScene(); };
  overlay.classList.add("show");
}

function onDefeat(){
  const overlay = document.getElementById("battle-overlay");
  document.getElementById("overlay-title").className = "overlay-title lose";
  document.getElementById("overlay-title").textContent = "全滅……";
  document.getElementById("overlay-desc").textContent = "パーティーは力尽きてしまった。直前のチェックポイント(HP・MP・持ち物そのまま)から再開する。";
  const btn = document.getElementById("overlay-btn");
  btn.textContent = "チェックポイントから再開する";
  btn.onclick = handleDefeatRestore;
  overlay.classList.add("show");
}

// 全滅時: 全回復はせず、直前のチェックポイントのスナップショットへそのまま復帰する
function handleDefeatRestore(){
  document.getElementById("battle-overlay").classList.remove("show");
  restoreCheckpoint();
  renderScene();
}

/* ===================== 準備画面(装備変更・アイテム使用) ===================== */
// 移動中(ストーリーシーン)から開ける。アイテム使用・装備割り当ての結果は
// 直接 state に反映され、次の saveCheckpoint() でそのまま保存される。
// BGM は bgm-prep に切り替え、閉じたら元のシーンBGMへ既存の setBgm でフェード復帰する。
const PARTY_ORDER = ["hero","aria","roi"];
const CHARM_INFO = { name:"聖なるお守り", img:"assets/images/items/equip-seinaru-omamori.png" };
let prepItemTarget = null;   // 使用対象を選択中のアイテムkey
let prepEquipTarget = null;  // 割り当て変更中の装備slot

// 銅の剣 → 伝説の剣 は heroWeaponTier で段階管理。見た目(名前/アイコン/効果量)を返す。
function swordInfo(){
  return state.heroWeaponTier >= 2
    ? { name:"伝説の剣", img:"assets/images/items/equip-densetsu-no-tsurugi.png", bonus:8 }
    : { name:"銅の剣",   img:"assets/images/items/equip-dou-no-tsurugi.png",      bonus:3 };
}

// 割り当て変更できる装備スロット(聖なるお守りはパーティー全体固定なので含めない)
const PREP_EQUIP_SLOTS = {
  sword: {
    owned:()=> state.heroWeaponTier > 0,
    info:()=> swordInfo(),
    effect:()=> "装備者の 攻撃力 +" + swordInfo().bonus
  },
  bracelet: {
    owned:()=> state.ariaMagicBoost,
    info:()=> ({ name:"魔法のブレスレット", img:"assets/images/items/equip-mahou-bracelet.png" }),
    effect:()=> "装備者の 魔法の威力 +4(魔法を使えるキャラのみ)"
  },
  shield: {
    owned:()=> state.roiShieldObtained,
    info:()=> ({ name:"鉄の大盾", img:"assets/images/items/equip-tetsu-no-tate.png" }),
    effect:()=> "装備者の 受けるダメージ -20%"
  }
};

function joinedMemberIds(){
  return PARTY_ORDER.filter(id => state.partyStats[id]);
}

function openPrep(){
  if(!screens.story.classList.contains("show")) return; // 戦闘中・タイトル等では開かない
  prepItemTarget = null;
  prepEquipTarget = null;
  showScreen("prep");
  setBgm("bgm-prep");
  document.getElementById("prep-log").textContent = "";
  renderPrep();
}

function closePrep(){
  prepItemTarget = null;
  prepEquipTarget = null;
  showScreen("story");
  setBgm(BGM.region[currentBg]); // 元のシーンBGMへフェード復帰
}

function prepLog(msg){
  document.getElementById("prep-log").textContent = msg;
}

function renderPrep(){
  renderPrepParty();
  renderPrepItems();
  renderPrepEquips();
}

function renderPrepParty(){
  const wrap = document.getElementById("prep-party");
  wrap.innerHTML = "";
  joinedMemberIds().forEach(id=>{
    const base = PARTY_MASTER[id];
    const st = state.partyStats[id];
    const held = [];
    Object.keys(PREP_EQUIP_SLOTS).forEach(slot=>{
      if(PREP_EQUIP_SLOTS[slot].owned() && state.equipOwner[slot] === id){
        held.push(PREP_EQUIP_SLOTS[slot].info().name);
      }
    });
    if(state.holyCharmObtained) held.push(CHARM_INFO.name);
    const hpPct = Math.max(0, (st.hp / base.maxHp) * 100);
    const card = document.createElement("div");
    card.className = "prep-mini-card";
    card.innerHTML = `
      <div class="prep-mini-avatar"><img src="${base.img}" alt="${base.name}"></div>
      <div class="prep-mini-body">
        <div class="prep-mini-name">${base.name}</div>
        <div class="bar-track"><div class="bar-fill ${hpPct<=30?'hp low':'hp'}" style="width:${hpPct}%;"></div></div>
        <div class="prep-mini-num">HP ${st.hp} / ${base.maxHp}</div>
        ${base.maxMp>0 ? `<div class="bar-track" style="margin-top:3px;"><div class="bar-fill mp" style="width:${(st.mp/base.maxMp)*100}%;"></div></div><div class="prep-mini-num">MP ${st.mp} / ${base.maxMp}</div>` : ""}
        <div class="prep-mini-equip">${held.length ? "装備: " + held.join(" / ") : "装備なし"}</div>
      </div>
    `;
    wrap.appendChild(card);
  });
}

// 回復の余地があるメンバーだけを対象候補にする
function prepItemTargets(key){
  return joinedMemberIds().filter(id=>{
    const base = PARTY_MASTER[id], st = state.partyStats[id];
    if(ITEM_DEFS[key].kind === "mp") return base.maxMp > 0 && st.mp < base.maxMp;
    return st.hp < base.maxHp;
  });
}

function renderPrepItems(){
  const wrap = document.getElementById("prep-items");
  wrap.innerHTML = "";
  const keys = Object.keys(ITEM_DEFS).filter(k => state.inventory[k] > 0);
  if(keys.length === 0){
    wrap.innerHTML = '<div class="prep-empty">手持ちのどうぐはありません。</div>';
    return;
  }
  keys.forEach(key=>{
    const def = ITEM_DEFS[key];
    const count = state.inventory[key];
    const targets = prepItemTargets(key);
    let controls;
    if(prepItemTarget === key){
      controls = '<div class="prep-choose">'
        + '<span class="prep-choose-lbl">だれに使う？</span>'
        + joinedMemberIds().map(id=>{
            const ok = targets.includes(id);
            return '<button class="prep-btn small" ' + (ok ? '' : 'disabled') + ' onclick="usePrepItem(\'' + key + '\',\'' + id + '\')">' + PARTY_MASTER[id].name + '</button>';
          }).join('')
        + '<button class="prep-btn small ghost" onclick="cancelPrepItem()">やめる</button>'
        + '</div>';
    } else {
      controls = '<div class="prep-row-ctrl"><button class="prep-btn" ' + (targets.length ? '' : 'disabled') + ' onclick="pickPrepItem(\'' + key + '\')">つかう</button></div>';
    }
    const row = document.createElement("div");
    row.className = "prep-row";
    row.innerHTML = `
      <div class="prep-row-icon"><img src="${def.img}" alt="${def.name}"></div>
      <div class="prep-row-main">
        <div class="prep-row-name">${def.name} <span class="prep-count">×${count}</span></div>
        <div class="prep-row-desc">${def.desc}</div>
      </div>
      ${controls}
    `;
    wrap.appendChild(row);
  });
}

function pickPrepItem(key){ prepItemTarget = key; prepEquipTarget = null; renderPrep(); }
function cancelPrepItem(){ prepItemTarget = null; renderPrep(); }

function usePrepItem(key, targetId){
  if(state.inventory[key] <= 0) return;
  if(!state.partyStats[targetId]) return;
  const base = PARTY_MASTER[targetId];
  const st = state.partyStats[targetId];
  let msg;
  // 回復量は戦闘中の useItem と揃える(やくそう25 / マナのしずく15 / げんきのねっこ 全回復)
  if(key === "manaDrop"){
    if(base.maxMp <= 0) return;
    const before = st.mp;
    st.mp = Math.min(base.maxMp, st.mp + 15);
    msg = base.name + "の MPが " + (st.mp - before) + " 回復した。";
  } else if(key === "lifeRoot"){
    const before = st.hp;
    st.hp = base.maxHp;
    msg = base.name + "の HPが " + (st.hp - before) + " 回復した。";
  } else {
    const before = st.hp;
    st.hp = Math.min(base.maxHp, st.hp + 25);
    msg = base.name + "の HPが " + (st.hp - before) + " 回復した。";
  }
  state.inventory[key]--;
  prepItemTarget = null;
  prepLog(ITEM_DEFS[key].name + "を使った。" + msg);
  renderPrep();
}

function renderPrepEquips(){
  const wrap = document.getElementById("prep-equips");
  wrap.innerHTML = "";
  const ownedSlots = Object.keys(PREP_EQUIP_SLOTS).filter(s => PREP_EQUIP_SLOTS[s].owned());
  if(ownedSlots.length === 0 && !state.holyCharmObtained){
    wrap.innerHTML = '<div class="prep-empty">まだ そうびを 手に入れていません。</div>';
    return;
  }
  ownedSlots.forEach(slot=>{
    const def = PREP_EQUIP_SLOTS[slot];
    const info = def.info();
    const owner = state.equipOwner[slot];
    const ownerName = owner && PARTY_MASTER[owner] ? PARTY_MASTER[owner].name : "未装備";
    let controls;
    if(prepEquipTarget === slot){
      controls = '<div class="prep-choose">'
        + '<span class="prep-choose-lbl">だれに装備？</span>'
        + joinedMemberIds().map(id=>
            '<button class="prep-btn small ' + (owner === id ? 'on' : '') + '" onclick="assignEquip(\'' + slot + '\',\'' + id + '\')">' + PARTY_MASTER[id].name + '</button>'
          ).join('')
        + '<button class="prep-btn small ghost" onclick="assignEquip(\'' + slot + '\',\'\')">外す</button>'
        + '<button class="prep-btn small ghost" onclick="cancelPrepEquip()">やめる</button>'
        + '</div>';
    } else {
      controls = '<div class="prep-row-ctrl"><button class="prep-btn" onclick="pickPrepEquip(\'' + slot + '\')">変更</button></div>';
    }
    const row = document.createElement("div");
    row.className = "prep-row";
    row.innerHTML = `
      <div class="prep-row-icon"><img src="${info.img}" alt="${info.name}"></div>
      <div class="prep-row-main">
        <div class="prep-row-name">${info.name}</div>
        <div class="prep-row-desc">${def.effect()}</div>
        <div class="prep-row-owner">装備中: <strong>${ownerName}</strong></div>
      </div>
      ${controls}
    `;
    wrap.appendChild(row);
  });
  if(state.holyCharmObtained){
    const row = document.createElement("div");
    row.className = "prep-row";
    row.innerHTML = `
      <div class="prep-row-icon"><img src="${CHARM_INFO.img}" alt="${CHARM_INFO.name}"></div>
      <div class="prep-row-main">
        <div class="prep-row-name">${CHARM_INFO.name}</div>
        <div class="prep-row-desc">パーティー全員の 受けるダメージ -10%</div>
        <div class="prep-row-owner">装備中: <strong>パーティー全員</strong></div>
      </div>
      <div class="prep-row-ctrl"><span class="prep-passive">常時発動</span></div>
    `;
    wrap.appendChild(row);
  }
}

function pickPrepEquip(slot){ prepEquipTarget = slot; prepItemTarget = null; renderPrep(); }
function cancelPrepEquip(){ prepEquipTarget = null; renderPrep(); }

function assignEquip(slot, ownerId){
  if(!PREP_EQUIP_SLOTS[slot] || !PREP_EQUIP_SLOTS[slot].owned()) return;
  if(ownerId && !state.partyStats[ownerId]) return;
  state.equipOwner[slot] = ownerId || null;
  const info = PREP_EQUIP_SLOTS[slot].info();
  prepEquipTarget = null;
  prepLog(info.name + " を " + (ownerId ? PARTY_MASTER[ownerId].name + " に装備した。" : "外した。"));
  renderPrep();
}
</script>
